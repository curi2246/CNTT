<!DOCTYPE html>
<html lang="ko" style="background-color: #020d0d;">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CENTRAL DATABASE - SYSTEM ERROR</title>
    <style>
        * { box-sizing: border-box; font-family: 'Courier New', monospace; }
        :root {
            --neon-pink: #ff5e5e;
            --neon-mint: #5effeb;
            --bg-black: #020d0d; 
        }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #010808; }
        ::-webkit-scrollbar-thumb { background: #222; border-radius: 5px; border: 2px solid #010808; }
        ::-webkit-scrollbar-thumb:hover { background: #333; }

        body {
            margin: 0; background: var(--bg-black); color: var(--neon-pink);
            overflow-x: hidden; overflow-y: auto; 
            transition: none; 
        }

        .bg-sigil {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: min(70vh, 70vw); color: rgba(94, 255, 235, 0.05);
            z-index: 1; pointer-events: none;
            animation: pulse-neon 3s ease-in-out infinite;
        }

        @keyframes pulse-neon {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.05; text-shadow: 0 0 10px rgba(94, 255, 235, 0.1); }
            50% { transform: translate(-50%, -50%) scale(1.05); opacity: 0.2; text-shadow: 0 0 40px rgba(94, 255, 235, 0.5); }
        }

        .auth-success-flash { animation: flash-mint 0.8s ease-out forwards; }
        @keyframes flash-mint {
            0% { background-color: var(--neon-mint); filter: brightness(2); }
            100% { background-color: var(--bg-black); }
        }

        .auth-error-flash { animation: flash-red 0.5s ease-in-out; }
        @keyframes flash-red {
            0%, 100% { background-color: var(--bg-black); }
            50% { background-color: #440a0a; }
        }

        @keyframes screenShake {
            0% { transform: translate(0); filter: hue-rotate(0deg); }
            10% { transform: translate(-5px, 5px); filter: invert(1); }
            20% { transform: translate(5px, -5px); }
            30% { transform: translate(-5px, 0); }
            100% { transform: translate(0); }
        }
        .glitch-active { animation: screenShake 0.15s infinite !important; }

        .screen { 
            position: relative; width: 100vw; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            padding: 5vh 20px; z-index: 2; 
        }

        #auth-screen { justify-content: center; }
        .terminal { width: 100%; max-width: 600px; border: 1px solid var(--neon-pink); background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px); padding: 20px; margin-bottom: 15px; position: relative; }
        
        #file-scroll-container { width: 100%; overflow: visible; }
        
        .hidden-trigger-zone { 
            margin-top: 50px; 
            padding-top: 100vh; 
            padding-bottom: 200px;
            text-align: center; 
            display: none; 
            transition: opacity 0.5s;
            opacity: 0;
        }

        .hidden-button { width: 60px; height: 60px; border-radius: 50%; background: radial-gradient(circle, #ff0000, #000); border: 2px solid #fff; cursor: pointer; margin: 20px auto; box-shadow: 0 0 15px #ff0000; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        .directory { width: 100%; max-width: 600px; }
        .folder { border: 1px solid var(--neon-mint); color: var(--neon-mint); padding: 12px; margin-bottom: 8px; cursor: pointer; }
        .file { cursor: pointer; padding: 10px; color: #fff; border-left: 1px dashed #444; margin-left: 15px; }
        .hidden { display: none !important; }
        
        .typing-cursor::after { content: "|"; animation: blink 0.8s infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        #music-info-box {
            position: fixed; bottom: 20px; right: 20px; 
            background: rgba(0, 0, 0, 0.8); border: 1px solid var(--neon-mint); 
            color: var(--neon-mint); padding: 10px 15px; font-size: 12px; 
            z-index: 100; display: none; box-shadow: 0 0 10px rgba(94, 255, 235, 0.3);
        }

        /* 🔥 좌우 화살표 네비게이션 */
        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 80px;
            background: rgba(94, 255, 235, 0.1);
            border: 1px solid var(--neon-mint);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 10;
            font-size: 1.5rem;
            color: var(--neon-mint);
            user-select: none;
        }
        .nav-arrow:hover {
            background: rgba(94, 255, 235, 0.3);
            box-shadow: 0 0 15px var(--neon-mint);
        }
        .nav-arrow-left {
            left: -50px;
        }
        .nav-arrow-right {
            right: -50px;
        }

        /* 🔥 백그라운드 RGB 글리치 효과 */
        .glitch-bg-layer {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 9998; pointer-events: none;
            background: 
                linear-gradient(90deg, transparent 0%, rgba(0,255,255,0.03) 25%, transparent 50%, rgba(255,0,255,0.03) 75%, transparent 100%),
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,255,100,0.03) 2px, rgba(0,255,100,0.03) 4px);
            animation: bg-scan 0.1s infinite, bg-shift 0.2s infinite;
        }
        @keyframes bg-scan {
            0% { transform: translateY(0); }
            100% { transform: translateY(4px); }
        }
        @keyframes bg-shift {
            0% { background-position: 0 0; filter: hue-rotate(0deg); }
            50% { background-position: 100% 100%; filter: hue-rotate(180deg); }
            100% { background-position: 0 0; filter: hue-rotate(360deg); }
        }

        /* 🔥 RGB 분리 + 날카로운 흔들림 타이틀 */
        .title-rgb-glitch {
            font-size: 2.5rem; 
            letter-spacing: 12px; 
            font-weight: 900; 
            color: #fff;
            position: relative;
            display: inline-block;
            animation: sharp-shake 0.08s infinite, rgb-chromatic 0.15s infinite;
            text-shadow: 
                -5px 0 #ff0000, 
                5px 0 #00ffff,
                -3px 0 #00ff00,
                3px 0 #ff00ff;
        }
        @keyframes sharp-shake {
            0% { transform: translate(3px, -2px) skew(2deg); }
            25% { transform: translate(-4px, 3px) skew(-3deg); }
            50% { transform: translate(5px, -1px) skew(1deg); }
            75% { transform: translate(-2px, 2px) skew(-2deg); }
            100% { transform: translate(0); }
        }
        @keyframes rgb-chromatic {
            0% { 
                text-shadow: -5px 0 #ff0000, 5px 0 #00ffff, -3px 0 #00ff00, 3px 0 #ff00ff;
                filter: hue-rotate(0deg);
            }
            50% { 
                text-shadow: 5px 0 #ff0000, -5px 0 #00ffff, 3px 0 #00ff00, -3px 0 #ff00ff;
                filter: hue-rotate(90deg);
            }
            100% { 
                text-shadow: -5px 0 #ff0000, 5px 0 #00ffff, -3px 0 #00ff00, 3px 0 #ff00ff;
                filter: hue-rotate(180deg);
            }
        }

        /* 🔥 빠른 글리치 타이핑 효과 */
        .fast-glitch-typing {
            animation: fast-typing-distortion 0.05s infinite;
        }
        @keyframes fast-typing-distortion {
            0% { transform: translate(2px, -2px); filter: brightness(1.5) hue-rotate(90deg); opacity: 0.9; }
            25% { transform: translate(-3px, 2px); filter: brightness(0.7) hue-rotate(180deg); opacity: 1; }
            50% { transform: translate(3px, -1px); filter: brightness(1.3) hue-rotate(270deg); opacity: 0.85; }
            75% { transform: translate(-2px, 3px); filter: brightness(0.8) hue-rotate(0deg); opacity: 1; }
            100% { transform: translate(0); filter: brightness(1); opacity: 1; }
        }

        /* 일반 텍스트는 글리치 영향 안받음 */
        .stable-text {
            animation: none !important;
            transform: none !important;
            filter: none !important;
        }
    </style>
</head>

                "Leay_Full_Archive.txt": "명칭: 리에(Leay)\n\n[종족]\n인간(human),노에인(Noein)\n\n[성별]\n여성\n\n[프로필]\n키: 169cm\n몸무게: 51.2kg]\n성격: 친절하면서도 이기주의 성향의 소유자이며 때때로 이익을 따지기도 한다.\n외형: 흰색 머리카락에 약간 왜소한 체형을 하고있고 밝은 회색에 후드티를 입고 다니며 대부분 모자를 쓰고 다니며 활동한다. 중간중간 모자를 벗고 다양한 패션을 보여준 적도 있지만 대부분 몸을 어느정도 가리고 다닌다.\n\n[능력]\n기본적인 여성의 근력과 능력을 가졌지만 리셋에서도 잃지않는 기억들과 끈기, 무엇보다 여러 일들을 겹쳐 겪은 여파로 모든 생물들 중에서 가장 뒤어난 동체시력을 가지고 있다.\n\n[일행]\n큐로,키스네와 대부분 함께 지내며 어디에서 잠과 식사를 해결하는지는 미지수이다.\n\n[만난 적 있음, 혹은 접점이 있던 존재들]\n아레인(Arein), 토리(tory), 시로(shiro), 실크(silk), 애키스(ekis), 키스네 코든(kisune_Corden) 등등 대부분의 인물들과 전부 접점이 있던 것으로 알려져 있으며 대부분 친분이 어느정도 있는 것으로 추정되고 있다.",
                "Curo_Half_Archive.txt": "명칭: 큐로(Curo)\n\n[종족]\n요괴(yokai), 구미호(nine tail)\n\n[성별]남성\n\n[프로필\n키: 180cm\n몸무게: 72.1kg\n성격: 품어주면서도 어느정도 냉정하게 상대를 대하는 이익주의자 성격의 소유자\n외형: 검은 머리카락에 검은 반팔을 입고 다니며 그 위에는 밝은 하늘색 후드집업을 입고 다닌다. 1개의 여우 꼬리와 귀를 가지고 있으며 꼬리의 끝 부분에서는 경계가 있고 그 경계는 밝은 빨강을 띄고 있다. 바깥 부분은 밝은 회색이며 귀도 이와같이 내부는 밝은 빨강에 바깥은 밝은 회색을 띄고 있다. 눈 색은 원래 두 눈 모두 바닷빛 푸른 눈을 지니고 있었지만 어린시절 어느 강제 실험으로 인해 왼쪽 눈은 루비빛 눈을 하게 되어 오드아이로 변하게 되었다.\n\n[능력]\n기본적으로 푸른색에 글리치로 일렁이는 포탈과 블래스터를 사용하고 있다. 블래스터의 형태는 명확한 총신이나 포신으로 고정되지 않고, 중심부에서부터 부서진 결정과 금속 파편이 뒤틀린 채 방사형으로 뻗어 나간 구조를 하고 있다. 전체 실루엣은 날개와 포신의 중간쯤 되는 모습으로, 좌우가 완전히 대칭이 아니며 일부는 의도적으로 깨진 듯 어긋나 있다. 주 재질은 짙은 청록색과 회청색 금속, 그 사이사이에 빛을 머금은 에메랄드색 에너지 코어 조각이 박혀 있다. 이 코어들은 일정한 박동으로 희미하게 빛나며, 블래스터가 '충전 중'일 때는 균열 사이로 빛이 새어 나와 공기를 베어내듯 흔적을 남긴기록상 확인된 다른 양상으로는 블래스터가 거대한 용의 형상으로 전개되는 경우가 있다. 이때는 사용자가 그 위에 직접 올라타 이동하는 것이 가능하며, 용의 입 부분을 뒤로 꺾어 에너지를 발사함과 동시에 추진력을 증폭시키는 장면도 보고되었다. 또한 내부 공간이 확장된 듯 보이는 현상이 관측되어, 다인승 구조로 여러 인물을 태운 채 장거리 이동을 하는 모습 역시종종 목격된다. 블래스터의 후방은 특히 불안정해 보이는데, 검은 입자와 잉크처럼 번지는 잔해 항상 주변에 떠다닌다. 이는 발사 후의 잔열이나, 공간 자체가 찢겨 나간 부산물처럼 보이며 완전히 사라지지 않고 천천히 흩어졌다 다시 끌려온다. 이로 인해 블래스터는 정지해 있어도 끊임없이 움직이는 것 같은 인상을 준다. 발사부는 하나로 고정되어 있지 않고, 상황에 따라 집속형으로 수렴하거나 넓게 퍼지는 파괴광으로 변형된다. 강력한 일격을 준비할 때는 전체 구조가 안쪽으로 조여 들며 날카로운 창 형태가 되고, 난사나 제압 시에는 균열이 벌어지며 파편들이 외곽으로 확장된다.\n\n[일행]\n키스네(Kisune), 리에(Leay)  이 두명이서 같이 지내는 것으로 추정되며 특히 키스네와 매우 사이가 좋은 것으로 보아 둘이 연인 사이인 것으로 예상된다.\n\n[만난 적 있음, 혹은 접점이 있던 존재들]\n아레인(Arein), 토리(tory), 시로(shiro), 실크(silk), 애키스(ekis), 알레프(Aleph), 키스네 코든(Kisune_Corden) 등등 여기서 애키스와는 사이가 매우 안 좋은 것으로 나와있다. 과거 어린시절 자신을 붙잡고 강제로 비 인류적인 실험을 강행하여 생긴 그로인해 그의 대해 말을 할 때면 주변 공기가 싸늘해지는 것을 볼 수 있다.",
                "Curo_REAL_Hidden_Content": "명칭: 큐로?(Curo?) [GLITCH_DATA]\n\n시간의 어느 중간지점에서 부정적인 감정과 글리치가 서로 폭주를 일으켜 나타난 존재로 모습은 큐로의 형태를 하고 있으나\n눈 부분이 글리치로 뒤덮혀 있으며 매우 광기적인 성격을 띈다 가장 큰 예시로 항상 웃고 있으며 중간마다 삐- 소리와 함께 블루 스크린으로 변하는데 그 때 어디서 나타날지 모르는 상태가 된다.\n목소리는 매우 이상해지며 얇은 목소리, 굵은 목소라 등등 나눌 수 없으며 항상 제각각으로 목소리가 나온다.\n\n[능력]\n기본보다 매우 빠른 속도로 움직이며 글리치를 일으켜 자신의 분신을 만들기도 한다. 이후 능력들은 동일.\n\n딱 한번만 등장했으며 아이든을 상대한 이후 눈 부분에 있던 글리치가 완전히 깨지며 정신을 잃은 이후 다시는 등장 한 적이 없다. 하지만 이후 !#m'>y:ung*ho로 변모했으며 자세한 설명은 입력하여 직접 찾아보는 것을 추천한다.",
                "Kisune_Full_Archive.txt": "명칭: 키스네(Kisune)\n\n[종족]\n악마(pure demon)\n\n[성별]\n여성\n\n[프로필\n키: 158cm\n몸무게: 46.6kg\n성격: 악마라는 것이 무색하게 매우 친절하지만 악마는 악마인지라 살생을 하지 말아야할 이유를 모르며 무조건 자기가 정당하다는 자기 주장이 강한 성격\n외형: 흰색 반팔을 입고 있으며 그 위에 아주 약간 밝은 검정 후드집업을 입고 다니고 있다. 다른 일행에 비해 가장 패션이 다양하며 수영복, 유카타 등등 다양한 패션을 보여준 적이 있다.\n\n[능력]\n다른 악마들보다 더욱 뛰어난 계약 체결 능력을 가지고 있으며 그 계약의 여파로 계약자의 능력을 일부분 가져가 자신이 사용 하는 것이 가능하다. 예를 들어 큐로의 포탈과 블래스터를 가져다 쓸 수는 있지만 위력은 약해진 상태로 나오거나 포탈의 거리가 매우 짧아진 상태로 소환이 가능해지는 것 등등 본인의 역량이 강하면 강할 수록 그 능력들도 본 위력을 발휘할 수 있게 된다.또한 어느 공간을 찢어 자신만의 공간을 오갈 수 있는 것으로 알려져 있으며 그 내부는 평범한 원룸으로 추정된다. 거기서 식사와 잠을 해결하는 것으로 보이며 다른 인물들도 초대하여 들어오는 것이 가능한 것으로 보아 대부분에 생활을 이 시공간에서 보내는 것으로 추정된다.\n\n[일행]\n큐로(curo), 키스네(Kisune), 리에(Leay) 이 세명이서만 다니는 것으로 보이며 특히 큐로와 자주 붙어다니고 애정행각을 하는 것을 보면은 큐로와 연인 사이인 것으로 보인다. 리에와는 매우 친하게 지내며 자주 장난을 주고받는 사이로 보이며 가끔 두명이서만 놀러 다니는 것이 보인다.\n\n만난 적 있음, 혹은 접점이 있던 존재들]\n아레인(Arein), 토리(tory), 시로(shiro), 실크(silk), 애키스(ekis), 알레프(Aleph), 키스네 코든(Kisune_Corden) 등등 다양한 인물들과 만나며 특히 키스네 코든과는 서로 어색한 사이를 유지 중이다. 다른 시간선에서 나타난 자신이란 사실에 처음에는 부정하며 살아가려 했지만 큐로의 말과 리에의 설득으로 어느정도 이해하며 같은 시간선에서 지내는 것을 별로 크게 신경쓰지 않고 나름 좋아지려 노력하는 모습이 보인다.\n\n[현재 가지고 있는 병]\n 키스네 코든, 자기 자신이 같은 시간선에 두명이 존재하는 오류 떄문에 부정적인 감정이 격해지면 격해질 수록 몸이 글리치가 일어나며 숨을 쉬기 어려워할 정도로 고통에 시달리는 것으로 보인다. 하지만 가끔씩 아무 이유 없이 갑자기 발병하는 일도 있지만 매우 드물며 키스네 본인도 이를 인지하고 최대한 인내심을 가지고 긍정적으로 살아가고 있다.",
                "Shiro_Full_Archive.txt": "명칭: 시로(Shiro)\n\n[종족]\n천사(angel), 노에인?(Noein?)\n\n[성별]\n남성\n\n[프로필]\n키: 187cm\n몸무게: 77.9kg\n성격: 매우 진중하지만 때때로 어디로 클지 모르는 미친 성격의 소유자. 하지만 천사라는 이름에 걸맞게 친절한 성격이기도 한다.\n외형: 검은 민트색 후드티를 입고 있으며 날개와 헤일로가 있는 전형적인 현대 천사의 모습을 보이고 있다. 하지만 헤일로의 모습이 글리치로 덮혀있으며 그러한 이유는 본인 또한 알려주지 않으며 알려지는 것을 극도로 싫어하는 것으로 알려져있다.\n\n[능력]\n천사들도 악마들처럼 같은 계약을 사용할 수 있으나 악마들과 다르게 목숨을 요구하는 듯 무리수를 두지 않고 대부분 본인들이 손해 보는 계약을 주로 한다. 하지만 시로는 이 능력을 매우 싫어하며 쓰는 것 또한 보인 적이 단 한번도 없다.\n\n[일행]\n그 누구와도 일행으로 섞이기 싫어하며 지극히 개인으로 다니는 것을 선호한다. 그로인해 항상 혼자인 것으로 보이며 가끔씩 다른 일행들과 만나지만 말 몇 번 섞고난 뒤에 곧바로 가는 것으로 보아 같이 있는 것 자체를 싫어하는 것으로 보인다.\n\n[만난 적 있음, 혹은 접점이 있던 존재들]\n큐로(curo), 키스네(kisune). 리에(leay)",

                "Reset.txt": "리셋(Reset)\n\n어느순간 세계 리셋 판정이 된다면 갑작스럽게 시작되는 세계 재설정 시기.\n\n[능력]\n모든 것을 무로 돌리는 것으로 생각하는 것 보다는 저장된 범위로 되돌리는 것으로 그 저장범위 이후에 있던 기억들과 했던 행동들, 자연 재해들도 전부 없던 것으로 치부되며 무슨 짓을 해서라도 도망가거나 맞서 싸울 수 없는 절대적 리셋이다.\n\n[노에인과 관계]\n지성이 있는 존재도 아니고 노에인도 받아들인 존재가 대부분이라 그렇게 노에인들에게 미움을 받지는 않는다.",
                "Noein.txt": "노에인(Noein)\n\n현재 존재하는 노에인은 정확히 밝혀진 존재들은 없지만 현재 3명정도 나온 것으로 추정된다.\n노에인으로는 각각 리에(Leay), 시로(Shiro), 토리(tory) 이 3명이 노에인으로 밝혀졌다.",
                "Glitch.log": "글리치(Glitch)\n\n글리치란 일종에 자연재해에 가까운 현상이며 어느 어디에서도 나타날지 모르는 매우 불규칙적인 성향을 나타내고 있다."
            }
        };

        window.addEventListener('keydown', (e) => {
            inputBuffer += e.key.toLowerCase();
            if (inputBuffer.length > 6) inputBuffer = inputBuffer.substring(inputBuffer.length - 6);
            if (inputBuffer === "glitch" && !isGlitchUnlocked) {
                isGlitchUnlocked = true;
                const mainBgm = document.getElementById("main-bgm");
                const glitchBgm = document.getElementById("glitch-bgm");
                if (mainBgm) mainBgm.pause();
                if (glitchBgm) { 
                    glitchBgm.currentTime = 0; 
                    glitchBgm.play().catch(err => console.log("재생 실패", err));
                }
                document.getElementById("music-title").textContent = "재생 중: error.mp3.mp3";
                document.body.classList.add('glitch-active');
                setTimeout(() => document.body.classList.remove('glitch-active'), 1500);
            }
        });

        document.getElementById("auth-form").onsubmit = (e) => {
            e.preventDefault();
            const val = document.getElementById("password-input").value;
            const msg = document.getElementById("auth-message");
            const bgm = document.getElementById("main-bgm");

            if(val === PASSWORD) {
                document.body.classList.add("auth-success-flash");
                msg.textContent = "> ACCESS GRANTED. SYNCHRONIZING...";
                msg.style.color = "var(--neon-mint)";
                
                if(bgm) bgm.play().catch(e => console.log("자동재생 차단됨"));
                document.getElementById("music-info-box").style.display = "block";

                setTimeout(() => {
                    document.body.classList.remove("auth-success-flash");
                    document.getElementById("auth-screen").classList.add("hidden");
                    document.getElementById("main-screen").classList.remove("hidden");
                    buildDirectory();
                    startMainTyping();
                }, 1200);
            } else {
                document.body.classList.add("auth-error-flash");
                msg.textContent = "> ACCESS DENIED";
                msg.style.color = "var(--neon-pink)";
                setTimeout(() => {
                    document.body.classList.remove("auth-error-flash");
                    document.getElementById("password-input").value = "";
                }, 500);
            }
        };

        function startMainTyping() {
            const term = document.getElementById("terminal-text");
            const lines = ["> 접속 승인. 환영합니다, 계약자님.", "> 데이터베이스 기록을 성공적으로 불러왔습니다."];
            let lIdx = 0, cIdx = 0;
            function type() {
                if(lIdx >= lines.length) return;
                let p = term.querySelectorAll("p")[lIdx];
                if(!p) { p = document.createElement("p"); term.appendChild(p); }
                p.textContent = lines[lIdx].slice(0, cIdx + 1);
                cIdx++;
                if(cIdx === lines[lIdx].length) { cIdx = 0; lIdx++; setTimeout(type, 600); } else { setTimeout(type, 40); }
            }
            type();
        }

        function buildDirectory() {
            const dir = document.getElementById("directory");
            dir.innerHTML = "";
            Object.keys(fileSystem).forEach(folder => {
                const fDiv = document.createElement("div"); 
                fDiv.className = "folder"; 
                fDiv.textContent = "📁 " + folder;
                const list = document.createElement("div"); 
                list.className = "hidden";
                fDiv.onclick = () => list.classList.toggle("hidden");
                
                Object.keys(fileSystem[folder]).forEach(file => {
                    if (file === "Curo_REAL_Hidden_Content") return;
                    
                    const fi = document.createElement("div"); 
                    fi.className = "file"; 
                    fi.textContent = "📄 " + file;
                    fi.onclick = (e) => { 
                        e.stopPropagation(); 
                        openFileWithNav(folder, file); 
                    };
                    list.appendChild(fi);
                });
                dir.appendChild(fDiv); 
                dir.appendChild(list);
            });
        }

        function openFileWithNav(folder, file) {
            currentFolder = folder;
            currentFileList = Object.keys(fileSystem[folder]).filter(f => f !== "Curo_REAL_Hidden_Content");
            currentFileIndex = currentFileList.indexOf(file);
            openFile(file, fileSystem[folder][file]);
        }

        function openFile(name, content) {
            window.scrollTo(0, 0); 
            document.getElementById("database-view").classList.add("hidden");
            document.getElementById("file-screen").classList.remove("hidden");
            document.getElementById("file-title").textContent = "FILE: " + name;
            const textTarget = document.getElementById("file-text");
            const hZone = document.getElementById("hidden-zone");
            textTarget.innerHTML = ""; 
            window.onscroll = null; 
            hZone.style.display = "none";

            // 🔥 기존 화살표 제거
            const oldArrows = document.querySelectorAll(".nav-arrow");
            oldArrows.forEach(arrow => arrow.remove());

            // 🔥 좌우 화살표 추가
            const terminalContainer = document.getElementById("file-terminal-container");
            
            if (currentFileIndex > 0) {
                const leftArrow = document.createElement("div");
                leftArrow.className = "nav-arrow nav-arrow-left";
                leftArrow.innerHTML = "◀";
                leftArrow.onclick = () => navigateFile(-1);
                terminalContainer.appendChild(leftArrow);
            }
            
            if (currentFileIndex < currentFileList.length - 1) {
                const rightArrow = document.createElement("div");
                rightArrow.className = "nav-arrow nav-arrow-right";
                rightArrow.innerHTML = "▶";
                rightArrow.onclick = () => navigateFile(1);
                terminalContainer.appendChild(rightArrow);
            }
            
            const sysMsg = document.createElement("p");
            sysMsg.style.color = "var(--neon-mint)"; 
            sysMsg.className = "typing-cursor";
            sysMsg.textContent = "> 기록 열람을 시작합니다...";
            textTarget.appendChild(sysMsg);

            setTimeout(() => {
                sysMsg.classList.remove("typing-cursor");
                const bodyMsg = document.createElement("div");
                bodyMsg.style.color = "#fff"; 
                bodyMsg.style.whiteSpace = "pre-wrap"; 
                bodyMsg.style.lineHeight = "1.6";
                textTarget.appendChild(bodyMsg);
                let charIdx = 0;
                function typeBody() {
                    if(charIdx < content.length) {
                        bodyMsg.textContent += content[charIdx]; 
                        charIdx++;
                        setTimeout(typeBody, 1); 
                    } else {
                        if (name.includes("Curo") && isGlitchUnlocked) {
                            hZone.style.display = "block";
                            window.onscroll = () => {
                                const scrollY = window.scrollY;
                                const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
                                const ratio = Math.min(scrollY / (maxScroll * 0.85), 1);
                                document.body.style.backgroundColor = `rgb(${Math.floor(2*(1-ratio))}, ${Math.floor(13*(1-ratio))}, ${Math.floor(13*(1-ratio))})`;
                                if (scrollY > maxScroll * 0.6) hZone.style.opacity = Math.min((scrollY - maxScroll * 0.6) / (maxScroll * 0.4), 1);
                                else hZone.style.opacity = "0";
                            };
                        }
                    }
                }
                typeBody();
            }, 800);
        }

        function navigateFile(direction) {
            currentFileIndex += direction;
            const newFileName = currentFileList[currentFileIndex];
            const newContent = fileSystem[currentFolder][newFileName];
            openFile(newFileName, newContent);
        }

        document.getElementById("back-btn").onclick = () => {
            window.onscroll = null; 
            document.body.style.backgroundColor = "var(--bg-black)";
            document.getElementById("file-screen").classList.add("hidden");
            document.getElementById("database-view").classList.remove("hidden");
            
            const arrows = document.querySelectorAll(".nav-arrow");
            arrows.forEach(arrow => arrow.remove());
        };

        function createAbyssFlash(color, duration) {
            const flash = document.createElement("div");
            flash.style.cssText = `position:fixed; top:0; left:0; width:100vw; height:100vh; background:${color}; z-index:11000; pointer-events:none;`;
            document.body.appendChild(flash);
            setTimeout(() => {
                flash.style.transition = `opacity ${duration/1000}s`;
                flash.style.opacity = "0";
                setTimeout(() => flash.remove(), duration);
            }, 50);
        }

        document.getElementById("secret-btn").onclick = () => {
            const fileScreenElem = document.getElementById("file-screen");
            const bgSigil = document.querySelector(".bg-sigil");
            const abyssBgm = document.getElementById("???-bgm");
            const glitchBgm = document.getElementById("glitch-bgm");

            fileScreenElem.style.opacity = "0";
            if(bgSigil) bgSigil.style.display = "none";
            if(glitchBgm) glitchBgm.pause();
            if(abyssBgm) { 
                abyssBgm.currentTime = 0; 
                abyssBgm.play(); 
            }
            
            document.getElementById("music-title").textContent = "재생 중: CENSORED!!.mp3.mp3";

            [0, 2400, 5000, 7400].forEach(time => setTimeout(() => createAbyssFlash("#fff", 400), time));

            setTimeout(() => {
                fileScreenElem.classList.add("hidden");
                const abyssLayer = document.createElement("div");
                abyssLayer.id = "abyss-layer";
                abyssLayer.style.cssText = `position:fixed; top:0; left:0; width:100vw; height:100vh; background:#000; z-index:9999; overflow:hidden; display:flex; align-items:center; justify-content:center; flex-direction:column;`;
                document.body.appendChild(abyssLayer);

                const bgGlitch = document.createElement("div");
                bgGlitch.className = "glitch-bg-layer";
                abyssLayer.appendChild(bgGlitch);

                const mainTextBox = document.createElement("div");
                mainTextBox.id = "abyss-text-box";
                mainTextBox.style.cssText = `width:80%; text-align:center; z-index:10001; position:relative;`;
                abyssLayer.appendChild(mainTextBox);

                const showAbyssText = (txt, col, d, sz) => {
                    setTimeout(() => {
                        const p = document.createElement("p"); p.textContent = txt;
                        p.style.cssText = `font-size:${sz}; color:${col}; margin:20px 0; opacity:0; transition:opacity 2s; font-weight:bold;`;
                        mainTextBox.appendChild(p); 
                        setTimeout(() => p.style.opacity = "1", 100);
                    }, d);
                };

                showAbyssText("CRITICAL ERROR: HIDDEN SECTOR ACCESSED", "#ff0000", 0, "2rem");
                showAbyssText("모든 기록이 소거되었습니다.", "#fff", 3000, "1.2rem");
                showAbyssText("당신은 보지 말아야 할 것을 보았습니다.", "#fff", 6500, "1.2rem");

                const warningInterval = setInterval(() => {
                    if (abyssBgm.currentTime >= 10.0 && abyssBgm.currentTime < 19.6) {
                        const warn = document.createElement("div");
                        warn.textContent = "SYSTEM_WARNING: ACCESS_VIOLATION";
                        warn.style.cssText = `position:absolute; color:#300; font-size:14px; left:${Math.random()*100}%; top:${Math.random()*100}%; opacity:0.6; z-index:10000; pointer-events:none; white-space:nowrap;`;
                        abyssLayer.appendChild(warn);
                        setTimeout(() => warn.remove(), 800);
                    }
                    
                    if (abyssBgm.currentTime >= 19.6 && !abyssLayer.dataset.cognized) {
                        abyssLayer.dataset.cognized = "true";
                        createAbyssFlash("#fff", 1000); 
                        
                        mainTextBox.innerHTML = "";
                        const p = document.createElement("h1");
                        p.textContent = "이제 '그'가 당신을 인지합니다.";
                        p.style.cssText = "font-size:3rem; color:#fff; font-weight:900; text-shadow:5px 0 red, -5px 0 blue, 0 0 20px #fff;";
                        mainTextBox.appendChild(p);
                    }

                    if (abyssBgm.currentTime >= 28.5 && !abyssLayer.dataset.cleared) {
                        abyssLayer.dataset.cleared = "true";
                        mainTextBox.innerHTML = "";
                    }
                    
                    if (abyssBgm.currentTime >= 29.6 && !abyssLayer.dataset.ended) {
                        abyssLayer.dataset.ended = "true";
                        clearInterval(warningInterval); 

                        createAbyssFlash("#fff", 3000);
                        mainTextBox.innerHTML = "";

                        setTimeout(() => {
                            const curoData = fileSystem["The main character"]["Curo_REAL_Hidden_Content"] || "데이터를 불러올 수 없습니다.";

                            mainTextBox.innerHTML = `
                                <div style="text-align:center; width:100%;">
                                    <h1 class="title-rgb-glitch" style="margin-bottom:40px;">
                                        CURO_THE_HALF_ARCHIVE
                                    </h1>
                                    <p id="curo-typing-area" class="fast-glitch-typing" style="color:#5effeb; font-size:1.1rem; line-height:1.8; white-space:pre-wrap; font-weight:bold;"></p>
                                </div>
                            `;

                            const typingArea = document.getElementById("curo-typing-area");
                            let charIdx = 0;

                            function typeCuroContent() {
                                if (charIdx < curoData.length) {
                                    typingArea.textContent += curoData[charIdx++];
                                    setTimeout(typeCuroContent, 25);
                                } else {
                                    typingArea.classList.remove("fast-glitch-typing");
                                    typingArea.classList.add("stable-text");
                                }
                            }
                            typeCuroContent();
                        }, 500); 
                    }
                }, 100);
            }, 9800);
        };
    </script>
</body>
</html>
