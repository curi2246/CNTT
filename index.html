<!DOCTYPE html>
<html lang="ko" style="background-color: #020d0d;">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CENTRAL DATABASE - SYSTEM ERROR</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="bg-sigil">⟡</div>

    <audio id="main-bgm" loop src="bgm.m4a.m4a"></audio>
    <audio id="glitch-bgm" loop src="error.mp3.mp3"></audio>
    <audio id="???-bgm" loop src="the hideen.mp3.mp3"></audio>

    <div id="music-info-box">
        <span style="margin-right: 5px;">🎵</span>
        <span id="music-title">재생 중: SYSTEM_MAIN.mp3</span>
    </div>

    <div id="auth-screen" class="screen">
        <div class="header"><h1>SECURITY CHECK</h1></div>
        <div id="auth-message" style="margin-bottom: 10px;">ENTER ACCESS KEY</div>
        <div class="terminal">
            <form id="auth-form">
                <input id="password-input" type="password" placeholder="PASSWORD" autocomplete="off" style="width:100%; text-align:center; background:none; border:none; border-bottom:1px solid var(--neon-mint); color:white; outline:none;">
            </form>
        </div>
    </div>

    <div id="main-screen" class="screen hidden">
        <div id="database-view" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            <div class="header"><h1>CENTRAL DATABASE</h1></div>
            <div class="terminal"><div id="terminal-text"></div></div>
            <div class="directory" id="directory"></div>
        </div>

        <div id="file-screen" class="hidden" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            <div class="header"><h1 id="file-title">FILE</h1></div>
            <div class="terminal">
                <div id="file-scroll-container">
                    <div id="file-text"></div>
                    <div id="hidden-zone" class="hidden-trigger-zone">
                        <p style="color:red; font-weight:bold;">CRITICAL ERROR: HIDDEN SECTOR FOUND</p>
                        <div id="secret-btn" class="hidden-button"></div>
                    </div>
                </div>
            </div>
            <button id="back-btn" style="background:none; border:1px solid var(--neon-mint); color:var(--neon-mint); padding:10px; cursor:pointer; margin-bottom: 50px;">← BACK</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
