<!DOCTYPE html>
<html lang="ko" style="background-color: #020d0d;">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STORY ARCHIVE</title>
    <style>
        * { box-sizing: border-box; font-family: 'Courier New', monospace; }
        :root {
            --neon-pink: #ff5e5e;
            --neon-mint: #5effeb;
            --bg-black: #020d0d;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #010808; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

        body {
            margin: 0;
            background: var(--bg-black);
            color: var(--neon-pink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .bg-sigil {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: min(70vh, 70vw);
            color: rgba(94,255,235,0.04);
            z-index: 0; pointer-events: none;
            animation: pulse-neon 3s ease-in-out infinite;
        }
        @keyframes pulse-neon {
            0%,100% { opacity: 0.04; }
            50%      { opacity: 0.13; }
        }

        #story-header {
            position: relative; z-index: 10;
            width: 100%; max-width: 1100px;
            margin: 0 auto;
            padding: 28px 24px 0;
        }
        #back-btn {
            display: inline-block;
            background: none;
            border: 1px solid var(--neon-pink);
            color: var(--neon-pink);
            padding: 5px 14px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 18px;
            text-decoration: none;
        }
        #back-btn:hover { background: rgba(255,94,94,0.15); box-shadow: 0 0 10px var(--neon-pink); }

        #story-title {
            font-size: 1.7rem;
            font-weight: 900;
            letter-spacing: 6px;
            color: #fff;
            text-shadow: 0 0 18px var(--neon-mint), 0 0 36px rgba(94,255,235,0.25);
            margin: 0 0 5px;
        }
        #story-subtitle {
            font-size: 11px;
            color: var(--neon-mint);
            letter-spacing: 3px;
            opacity: 0.7;
            margin: 0 0 20px;
        }
        .header-line {
            width: 100%; height: 1px;
            background: linear-gradient(90deg, var(--neon-mint), transparent);
            margin-bottom: 22px;
        }

        #viewer-wrap {
            position: relative; z-index: 10;
            width: 100%; max-width: 1100px;
            margin: 0 auto;
            padding: 0 24px 60px;
            flex: 1;
        }

        .story-layout {
            display: flex;
            gap: 14px;
            align-items: stretch;
            min-height: 500px;
        }

        /* 왼쪽 사진 박스 */
        .photo-box {
            flex: 0 0 42%;
            border: 1px solid var(--neon-mint);
            background: rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 460px;
        }
        .photo-box img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
            position: absolute;
            top: 0; left: 0;
        }
        .photo-placeholder {
            width: 100%; height: 100%;
            min-height: 460px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: rgba(94,255,235,0.3);
            font-size: 11px;
            letter-spacing: 2px;
            gap: 14px;
            padding: 24px;
            text-align: center;
        }
        .photo-placeholder .icon { font-size: 2.8rem; opacity: 0.35; }
        .photo-upload-label {
            border: 1px dashed rgba(94,255,235,0.4);
            padding: 8px 16px;
            cursor: pointer;
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--neon-mint);
            transition: all 0.2s;
        }
        .photo-upload-label:hover { background: rgba(94,255,235,0.1); box-shadow: 0 0 8px rgba(94,255,235,0.3); }
        .photo-upload-input { display: none; }

        .corner { position: absolute; width: 12px; height: 12px; border-color: var(--neon-mint); border-style: solid; opacity: 0.6; }
        .corner.tl { top: 6px; left: 6px; border-width: 1px 0 0 1px; }
        .corner.tr { top: 6px; right: 6px; border-width: 1px 1px 0 0; }
        .corner.bl { bottom: 6px; left: 6px; border-width: 0 0 1px 1px; }
        .corner.br { bottom: 6px; right: 6px; border-width: 0 1px 1px 0; }

        /* 오른쪽 스토리 박스 */
        .story-box {
            flex: 1;
            border: 1px solid var(--neon-pink);
            background: rgba(0,0,0,0.75);
            position: relative;
            display: flex;
            flex-direction: column;
            min-height: 460px;
        }
        .story-box-header {
            padding: 11px 16px 10px;
            border-bottom: 1px solid rgba(255,94,94,0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .story-box-tag { font-size: 9px; letter-spacing: 3px; color: rgba(255,94,94,0.55); }
        .story-page-num { font-size: 10px; color: rgba(255,94,94,0.5); letter-spacing: 2px; }

        .story-text-area {
            flex: 1;
            padding: 22px 20px;
            overflow: hidden;
        }
        .story-text-area p {
            margin: 0 0 14px;
            font-size: 13px;
            line-height: 2;
            color: rgba(255,255,255,0.87);
            letter-spacing: 0.4px;
        }
        .story-text-area p:last-child { margin-bottom: 0; }

        .story-nav {
            padding: 10px 16px;
            border-top: 1px solid rgba(255,94,94,0.15);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .nav-btn {
            background: none;
            border: 1px solid rgba(255,94,94,0.35);
            color: var(--neon-pink);
            padding: 4px 14px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            letter-spacing: 2px;
            transition: all 0.2s;
        }
        .nav-btn:hover:not(:disabled) { background: rgba(255,94,94,0.14); box-shadow: 0 0 8px rgba(255,94,94,0.35); }
        .nav-btn:disabled { opacity: 0.18; cursor: default; }

        .page-dots { display: flex; gap: 7px; align-items: center; }
        .page-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: rgba(255,94,94,0.28);
            transition: all 0.2s; cursor: pointer;
        }
        .page-dot.active { background: var(--neon-pink); box-shadow: 0 0 7px var(--neon-pink); }

        .story-text-area.fade-out { animation: fadeOut 0.15s forwards; }
        .story-text-area.fade-in  { animation: fadeIn  0.2s  forwards; }
        @keyframes fadeOut { from { opacity:1; transform:translateX(0); } to { opacity:0; transform:translateX(-10px); } }
        @keyframes fadeIn  { from { opacity:0; transform:translateX(10px); } to { opacity:1; transform:translateX(0); } }

        .scanline {
            position: fixed; inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,255,100,0.012) 2px, rgba(0,255,100,0.012) 4px);
            pointer-events: none; z-index: 9999;
        }
    </style>
</head>
<body>
<div class="bg-sigil">✦</div>
<div class="scanline"></div>

<div id="story-header">
    <button id="back-btn" onclick="history.back()">◀ BACK</button>
    <div id="story-title">—</div>
    <div id="story-subtitle">DAILY LOG</div>
    <div class="header-line"></div>
</div>

<div id="viewer-wrap">
    <div class="story-layout">
        <!-- 왼쪽: 사진 -->
        <div class="photo-box" id="photo-box">
            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>
            <div class="photo-placeholder" id="photo-placeholder">
                <div class="icon">◈</div>
                <div>NO IMAGE ATTACHED</div>
                <label class="photo-upload-label">
                    [ UPLOAD PHOTO ]
                    <input type="file" class="photo-upload-input" id="photo-upload" accept="image/*">
                </label>
            </div>
        </div>

        <!-- 오른쪽: 스토리 -->
        <div class="story-box">
            <div class="story-box-header">
                <span class="story-box-tag">▸ STORY LOG</span>
                <span class="story-page-num" id="page-num">1 / 1</span>
            </div>
            <div class="story-text-area" id="story-text-area"></div>
            <div class="story-nav">
                <button class="nav-btn" id="prev-btn" onclick="changePage(-1)">◀ PREV</button>
                <div class="page-dots" id="page-dots"></div>
                <button class="nav-btn" id="next-btn" onclick="changePage(1)">NEXT ▶</button>
            </div>
        </div>
    </div>
</div>

<script>
// ══════════════════════════════════════
// 캐릭터 데이터
// ══════════════════════════════════════
const CHARACTERS = {
    kuro: {
        name: "큐로",
        subtitle: "CURO · DAILY LOG",
        stories: [
            `큐로: "..."\n\n터벅..터벅...\n키스네: "뭐해?"\n\n자연스럽게 책상 옆에 핫 초코를 두고 앉는다\n큐로: "아 키스네 너구나 지난번에 얻었던 구슬 있지?"\n\n주머니에 손을 넣은 뒤 꺼낸 것은 내부에서 유리처럼 투명하지만 파란색 불이 나있는 어느 손바닥만한 작은 구슬이 있다.\n큐로: "리에가 이 구슬 사용법이 적혀있을 거라고 해서 잠시 읽고 있었어"`,
            `키스네: "...지금 며칠동안 읽고 있는게 그거야?"\n\n큐로: "아마도 맞을 걸 한참을 읽어도 안 나와서 망정이지"\n\n키스네: "지난번에 상대했던..누구였지?"\n\n큐로: "알레프?"\n\n키스네: "아 맞다 걔, 걔 상대할 때 알아내지 않았어?"\n\n 큐로: "나도 그런거 같은데 감만 조금 잡히고 여전히 모르겠어 자갈 밭에서 핀셋 찾는 느낌이야"`,
            `키스네: "흠..일단 알았어 일단 단거라도 먹어 너 좋아하잖아"\n\n큐로: "잘 먹을게 고마워"\n\n스윽..터벅...터벅...\n...후루룹`
        ]
    },
    kisne: {
        name: "키스네",
        subtitle: "KISUNE · DAILY LOG",
        stories: [
            ``,
            ``,
            ``
        ]
    },
    rie: {
        name: "리에",
        subtitle: "LEAY · DAILY LOG",
        stories: [
            ``,
            ``,
            ``
        ]
    }
};

// ══════════════════════════════════════
// 상태
// ══════════════════════════════════════
let currentPage = 0;
let pages = [];

// ══════════════════════════════════════
// 초기화
// ══════════════════════════════════════
function init() {
    const params = new URLSearchParams(window.location.search);
    const charKey = params.get('char') || 'kuro';
    const char = CHARACTERS[charKey] || CHARACTERS['kuro'];

    document.getElementById('story-title').textContent = char.name;
    document.getElementById('story-subtitle').textContent = char.subtitle;
    document.title = char.name + ' · STORY ARCHIVE';

    pages = char.stories;
    currentPage = 0;
    renderPage(false);
    renderDots();
}

function renderPage(animate) {
    const area = document.getElementById('story-text-area');
    if (animate) {
        area.classList.add('fade-out');
        setTimeout(() => {
            area.classList.remove('fade-out');
            setContent(area);
            area.classList.add('fade-in');
            setTimeout(() => area.classList.remove('fade-in'), 220);
        }, 160);
    } else {
        setContent(area);
    }
    document.getElementById('page-num').textContent = (currentPage + 1) + ' / ' + pages.length;
    document.getElementById('prev-btn').disabled = currentPage === 0;
    document.getElementById('next-btn').disabled = currentPage === pages.length - 1;
    document.querySelectorAll('.page-dot').forEach((d, i) => d.classList.toggle('active', i === currentPage));
}

function setContent(area) {
    area.innerHTML = '';
    pages[currentPage].split('\n\n').forEach(para => {
        if (para.trim()) {
            const p = document.createElement('p');
            p.textContent = para.trim();
            area.appendChild(p);
        }
    });
}

function renderDots() {
    const c = document.getElementById('page-dots');
    c.innerHTML = '';
    pages.forEach((_, i) => {
        const d = document.createElement('div');
        d.className = 'page-dot' + (i === 0 ? ' active' : '');
        d.onclick = () => { if (i !== currentPage) { currentPage = i; renderPage(true); } };
        c.appendChild(d);
    });
}

function changePage(dir) {
    const n = currentPage + dir;
    if (n < 0 || n >= pages.length) return;
    currentPage = n;
    renderPage(true);
}

// 사진 업로드
document.getElementById('photo-upload').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
        const box = document.getElementById('photo-box');
        const placeholder = document.getElementById('photo-placeholder');
        const old = box.querySelector('img');
        if (old) old.remove();
        const img = document.createElement('img');
        img.src = ev.target.result;
        box.appendChild(img);
        placeholder.style.display = 'none';
    };
    reader.readAsDataURL(file);
});

// 키보드 네비게이션
document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') changePage(-1);
    if (e.key === 'ArrowRight') changePage(1);
});

init();
</script>
</body>
</html>
