<!DOCTYPE html>
<html lang="ko" style="background-color: #020d0d;">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STORY ARCHIVE</title>
    <style>
        * { box-sizing: border-box; font-family: 'Courier New', monospace; }
        :root {
            --neon-pink: #ff5e5e;
            --neon-mint: #5effeb;
            --bg-black: #020d0d;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #010808; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

        body {
            margin: 0;
            background: var(--bg-black);
            color: var(--neon-pink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(ellipse 60% 45% at 82% -5%,
                    rgba(255, 210, 120, 0.10) 0%,
                    rgba(255, 175, 60,  0.05) 40%,
                    transparent 70%),
                radial-gradient(ellipse 35% 55% at 95% 10%,
                    rgba(255, 220, 140, 0.07) 0%,
                    transparent 60%);
        }
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(ellipse 100% 18% at 50% 100%,
                    rgba(255, 120, 40, 0.08) 0%,
                    rgba(255, 80,  20, 0.04) 50%,
                    transparent 100%),
                radial-gradient(ellipse 60% 10% at 60% 100%,
                    rgba(255, 160, 60, 0.05) 0%,
                    transparent 80%);
        }
        .dawn-mist {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 28%;
            pointer-events: none;
            z-index: 0;
            background: linear-gradient(to top,
                rgba(30, 12, 4, 0.18) 0%,
                rgba(20, 8, 2, 0.06) 50%,
                transparent 100%);
            animation: mistFloat 8s ease-in-out infinite;
        }
        @keyframes mistFloat {
            0%, 100% { opacity: 0.7; transform: translateY(0); }
            50%       { opacity: 1;   transform: translateY(-4px); }
        }
        .dawn-stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
        .dawn-star {
            position: absolute; border-radius: 50%;
            background: var(--star-color, rgba(180, 255, 240, 0.9));
            animation: starTwinkle var(--dur) ease-in-out infinite;
            animation-delay: var(--delay);
        }
        @keyframes starTwinkle {
            0%, 100% { opacity: var(--min-op); transform: scale(1); }
            50%       { opacity: var(--max-op); transform: scale(1.3); }
        }

        .bg-sigil {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: min(70vh, 70vw);
            color: rgba(94,255,235,0.04);
            z-index: 0; pointer-events: none;
            animation: pulse-neon 3s ease-in-out infinite;
        }
        @keyframes pulse-neon {
            0%,100% { opacity: 0.04; }
            50%      { opacity: 0.13; }
        }

        #story-header {
            position: relative; z-index: 10;
            width: 100%; max-width: 1100px;
            margin: 0 auto;
            padding: 28px 24px 0;
        }
        #back-btn {
            display: inline-block;
            background: none;
            border: 1px solid var(--neon-pink);
            color: var(--neon-pink);
            padding: 5px 14px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 18px;
            text-decoration: none;
        }
        #back-btn:hover { background: rgba(255,94,94,0.15); box-shadow: 0 0 10px var(--neon-pink); }

        #story-title {
            font-size: 1.7rem;
            font-weight: 900;
            letter-spacing: 6px;
            color: #fff;
            text-shadow: 0 0 18px var(--neon-mint), 0 0 36px rgba(94,255,235,0.25);
            margin: 0 0 5px;
        }
        #story-subtitle {
            font-size: 11px;
            color: var(--neon-mint);
            letter-spacing: 3px;
            opacity: 0.7;
            margin: 0 0 20px;
        }
        .header-line {
            width: 100%; height: 1px;
            background: linear-gradient(90deg, var(--neon-mint), transparent);
            margin-bottom: 22px;
        }

        #viewer-wrap {
            position: relative; z-index: 10;
            width: 100%; max-width: 1100px;
            margin: 0 auto;
            padding: 0 24px 60px;
            flex: 1;
        }

        .story-layout {
            display: flex;
            gap: 14px;
            align-items: stretch;
            min-height: 500px;
        }

        /* 왼쪽 사진 박스 */
        .photo-box {
            flex: 0 0 42%;
            border: 1px solid var(--neon-mint);
            background: #000;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 460px;
        }
        /* 메인 이미지 */
        .photo-box img.main-photo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            position: absolute;
            top: 0; left: 0;
            z-index: 2;
        }
        /* 블러 배경 (contain일 때 빈 공간을 채워줌) */
        .photo-box img.bg-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
            filter: blur(18px) brightness(0.35) saturate(0.7);
            transform: scale(1.1);
        }

        .corner { position: absolute; width: 12px; height: 12px; border-color: var(--neon-mint); border-style: solid; opacity: 0.6; z-index: 2; }
        .corner.tl { top: 6px; left: 6px; border-width: 1px 0 0 1px; }
        .corner.tr { top: 6px; right: 6px; border-width: 1px 1px 0 0; }
        .corner.bl { bottom: 6px; left: 6px; border-width: 0 0 1px 1px; }
        .corner.br { bottom: 6px; right: 6px; border-width: 0 1px 1px 0; }

        /* 오른쪽 스토리 박스 */
        @keyframes expandWidth {
            from { clip-path: inset(0 50% 0 50%); opacity: 0.3; }
            to   { clip-path: inset(0 0% 0 0%);   opacity: 1; }
        }
        .story-layout.expand-in .story-box,
        .story-layout.expand-in .photo-box {
            animation: expandWidth 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            overflow: hidden;
        }
        .story-layout.expand-in .photo-box {
            animation-delay: 0s;
        }
        .story-layout.expand-in .story-box {
            animation-delay: 0.06s;
        }

        .story-box {
            flex: 1;
            border: 1px solid var(--neon-pink);
            background: rgba(0,0,0,0.75);
            position: relative;
            display: flex;
            flex-direction: column;
            min-height: 460px;
        }
        .story-box-header {
            padding: 11px 16px 10px;
            border-bottom: 1px solid rgba(255,94,94,0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .story-box-tag { font-size: 9px; letter-spacing: 3px; color: rgba(255,94,94,0.55); }
        .story-page-num { font-size: 10px; color: rgba(255,94,94,0.5); letter-spacing: 2px; }

        .story-text-area {
            flex: 1;
            padding: 22px 20px;
            overflow-y: auto;
        }
        .story-text-area p {
            margin: 0 0 14px;
            font-size: 13px;
            line-height: 2;
            color: rgba(255,255,255,0.87);
            letter-spacing: 0.4px;
        }
        .story-text-area p:last-child { margin-bottom: 0; }

        .story-nav {
            padding: 10px 16px;
            border-top: 1px solid rgba(255,94,94,0.15);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .nav-btn {
            background: none;
            border: 1px solid rgba(255,94,94,0.35);
            color: var(--neon-pink);
            padding: 4px 14px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            letter-spacing: 2px;
            transition: all 0.2s;
        }
        .nav-btn:hover:not(:disabled) { background: rgba(255,94,94,0.14); box-shadow: 0 0 8px rgba(255,94,94,0.35); }
        .nav-btn:disabled { opacity: 0.18; cursor: default; }

        .page-dots { display: flex; gap: 7px; align-items: center; }
        .page-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: rgba(255,94,94,0.28);
            transition: all 0.2s; cursor: pointer;
        }
        .page-dot.active { background: var(--neon-pink); box-shadow: 0 0 7px var(--neon-pink); }

        .story-text-area.fade-out { animation: fadeOut 0.15s forwards; }
        .story-text-area.fade-in  { animation: fadeIn  0.2s  forwards; }
        @keyframes fadeOut { from { opacity:1; transform:translateX(0); } to { opacity:0; transform:translateX(-10px); } }
        @keyframes fadeIn  { from { opacity:0; transform:translateX(10px); } to { opacity:1; transform:translateX(0); } }

        .scanline {
            position: fixed; inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,255,100,0.012) 2px, rgba(0,255,100,0.012) 4px);
            pointer-events: none; z-index: 9999;
        }
    </style>
</head>
<body>
<div class="bg-sigil">✦</div>
<div class="scanline"></div>
<div class="dawn-mist"></div>
<div class="dawn-stars" id="dawn-stars"></div>

<!-- 오른쪽 하단 음악 박스 (index.html과 동일) -->
<div id="music-info-box" style="
    position: fixed; bottom: 20px; right: 20px;
    background: rgba(0,0,0,0.8); border: 1px solid #5effeb;
    color: #5effeb; padding: 10px 15px; font-size: 12px;
    z-index: 100; display: none; box-shadow: 0 0 10px rgba(94,255,235,0.3);
    gap: 10px; align-items: center; font-family: 'Courier New', monospace;
">
    <span>🎵</span>
    <span id="music-title-box">Now Playing: SYSTEM_MAIN.mp3</span>
    <button id="music-control-btn" onclick="toggleStoryMusic()" style="
        background: transparent; border: 1px solid #5effeb; color: #5effeb;
        padding: 4px 10px; cursor: pointer; font-size: 11px;
        letter-spacing: 1px; transition: all 0.2s; margin-left: 10px;
        font-family: 'Courier New', monospace;
    ">⏸ PAUSE</button>
</div>

<div id="story-header">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;">
        <button id="back-btn" onclick="goBack()" style="margin-bottom:0;">◀ BACK</button>
        <button id="lang-btn" onclick="toggleLang()" style="
            background: none; border: 1px solid var(--neon-mint); color: var(--neon-mint);
            padding: 5px 14px; font-family: 'Courier New', monospace; font-size: 11px;
            letter-spacing: 2px; cursor: pointer; transition: all 0.2s;
        ">KO / EN</button>
    </div>
    <div id="story-title">—</div>
    <div id="story-subtitle">DAILY LOG</div>
    <div class="header-line"></div>
</div>

<div id="viewer-wrap">
    <div class="story-layout">
        <div class="photo-box" id="photo-box">
            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>
        </div>
        <div class="story-box">
            <div class="story-box-header">
                <span class="story-box-tag">▸ DAILY LOG</span>
                <span class="story-page-num" id="page-num">1 / 1</span>
            </div>
            <div class="story-text-area" id="story-text-area"></div>
            <div class="story-nav">
                <button class="nav-btn" id="prev-btn" onclick="changePage(-1)">◀ PREV</button>
                <div class="page-dots" id="page-dots"></div>
                <button class="nav-btn" id="next-btn" onclick="changePage(1)">NEXT ▶</button>
            </div>
        </div>
    </div>
</div>

// 현재 언어에 따라 선택 (index.html의 currentLang 연동 or URL 파라미터)
let currentLang = new URLSearchParams(window.location.search).get('lang')
                || sessionStorage.getItem('savedLang') || 'en';

function getCharacters() {
    return currentLang === 'en' ? CHARACTERS_EN : CHARACTERS_KO;
}

// 언어 전환 버튼
function toggleLang() {
    currentLang = currentLang === 'ko' ? 'en' : 'ko';
    sessionStorage.setItem('savedLang', currentLang);
    // 현재 캐릭터 + 페이지 유지하면서 텍스트만 교체
    const chars = getCharacters();
    const char  = chars[currentChar] || chars['kuro'];
    document.getElementById('story-title').textContent    = char.name;
    document.getElementById('story-subtitle').textContent = char.subtitle;
    document.title = char.name + ' · STORY ARCHIVE';
    pages = char.stories;
    // 페이지 범위 초과 방지
    if (currentPage >= pages.length) currentPage = pages.length - 1;
    renderPage(false);
    renderDots();
    // 버튼 표시 업데이트
    const btn = document.getElementById('lang-btn');
    if (btn) btn.textContent = currentLang === 'ko' ? 'KO / EN' : 'EN / KO';
}

let currentPage = 0;
let pages = [];
let currentChar = 'kuro';

// ── 음악 이어받기 ──────────────────────────────
// index.html에서 재생 중이던 오디오 상태를 sessionStorage로 넘겨받아 이어서 재생
let bgAudio = null;
let isStoryMusicPlaying = true; // 멈춤 상태 추적

/* 오른쪽 하단 PAUSE/PLAY 버튼 */
function toggleStoryMusic() {
    const btn = document.getElementById('music-control-btn');
    if (!bgAudio) return;
    if (isStoryMusicPlaying) {
        bgAudio.pause();
        btn.textContent = '▶ PLAY';
        isStoryMusicPlaying = false;
        sessionStorage.setItem('musicPlaying', 'false');
    } else {
        bgAudio.play().catch(() => {});
        btn.textContent = '⏸ PAUSE';
        isStoryMusicPlaying = true;
        sessionStorage.setItem('musicPlaying', 'true');
    }
}

function resumeMusic() {
    const src     = sessionStorage.getItem('musicSrc');
    const timeStr = sessionStorage.getItem('musicTime');
    const playing = sessionStorage.getItem('musicPlaying'); // 'true' or 'false'

    // src가 없으면 메인 곡 기본값
    const audioSrc = (src && src.includes('blob:') === false) ? src : 'bgm.mp3.mp3';

    // 뮤직박스는 항상 표시 (멈춰있어도 박스는 보임)
    const box = document.getElementById('music-info-box');
    const btn = document.getElementById('music-control-btn');

    try {
        bgAudio = new Audio(audioSrc);
        bgAudio.loop = true;
        bgAudio.volume = 0.6;

        bgAudio.addEventListener('canplay', () => {
            if (timeStr) bgAudio.currentTime = parseFloat(timeStr);

            if (playing === 'false') {
                // ── 멈춰있던 상태 ──
                bgAudio.pause();
                isStoryMusicPlaying = false;
                if (btn) btn.textContent = '▶ PLAY';
            } else {
                // ── 재생 중이던 상태 ──
                bgAudio.play().catch(() => {
                    // 자동재생 차단 시 멈춤 상태로
                    isStoryMusicPlaying = false;
                    if (btn) btn.textContent = '▶ PLAY';
                });
                isStoryMusicPlaying = true;
                if (btn) btn.textContent = '⏸ PAUSE';
            }
        }, { once: true });

        // 파일명으로 타이틀 표시
        const titleEl = document.getElementById('music-title-box');
        if (titleEl) {
            const filename = audioSrc.split('/').pop().split('?')[0];
            titleEl.textContent = 'Now Playing: ' + decodeURIComponent(filename);
        }

        if (box) box.style.display = 'flex';

        // 2초마다 재생 위치 저장 (goBack 시 정확한 위치로)
        setInterval(() => {
            if (bgAudio) {
                sessionStorage.setItem('musicTime', String(bgAudio.currentTime));
                sessionStorage.setItem('musicPlaying', isStoryMusicPlaying ? 'true' : 'false');
            }
        }, 2000);

    } catch(e) {
        console.log('resumeMusic error:', e);
    }
}

// ── 뒤로가기: 메인 화면(데이터베이스) ────────────
function goBack() {
    // 현재 음악 상태 저장
    if (bgAudio) {
        sessionStorage.setItem('musicTime',    String(bgAudio.currentTime));
        sessionStorage.setItem('musicPlaying', isStoryMusicPlaying ? 'true' : 'false');
    }
    // index.html이 returnedFromBroken 패턴과 동일하게 처리
    sessionStorage.setItem('returnedFromStory', '1');
    window.location.href = 'index.html';
}

// ── 초기화 ──────────────────────────────────────
// 새벽 별 생성
(function() {
    const container = document.getElementById('dawn-stars');
    if (!container) return;
    // 민트·핑크·흰빛 팔레트 — 테마와 어울리게
    const palette = [
        { color: 'rgba(94,255,235,0.85)',  glow: 'rgba(94,255,235,0.25)'  },  // 민트
        { color: 'rgba(180,255,245,0.80)', glow: 'rgba(94,255,235,0.15)'  },  // 연민트
        { color: 'rgba(255,200,210,0.75)', glow: 'rgba(255,94,94,0.18)'   },  // 연핑크
        { color: 'rgba(220,210,255,0.70)', glow: 'rgba(180,140,255,0.15)' },  // 연보라
        { color: 'rgba(200,240,255,0.75)', glow: 'rgba(94,200,255,0.15)'  },  // 흰청
    ];
    const count = 36; // 너무 많으면 거슬림
    for (let i = 0; i < count; i++) {
        const s = document.createElement('div');
        s.className = 'dawn-star';
        const size = Math.random() * 1.4 + 0.3;
        const x = Math.random() * 100;
        const y = Math.random() * 58; // 상단 하늘에만
        const dur   = (Math.random() * 4 + 3).toFixed(1) + 's'; // 느리게
        const delay = (Math.random() * 6).toFixed(1) + 's';
        // 일출 방향(오른쪽 상단) 근처는 더 흐리게
        const distFromSun = Math.sqrt(Math.pow(x - 85, 2) + Math.pow(y, 2));
        const fade  = Math.min(1, distFromSun / 55);
        const minOp = (0.03 * fade).toFixed(2);
        const maxOp = (0.22 * fade).toFixed(2); // 전체적으로 낮게
        const p = palette[Math.floor(Math.random() * palette.length)];
        s.style.cssText = `width:${size}px;height:${size}px;left:${x}%;top:${y}%;--dur:${dur};--delay:${delay};--min-op:${minOp};--max-op:${maxOp};--star-color:${p.color};box-shadow:0 0 ${size*2}px ${p.glow};`;
        container.appendChild(s);
    }
})();

function init() {
    const params = new URLSearchParams(window.location.search);
    currentChar = params.get('char') || 'kuro';
    const chars = getCharacters();
    const char  = chars[currentChar] || chars['kuro'];

    document.getElementById('story-title').textContent    = char.name;
    document.getElementById('story-subtitle').textContent = char.subtitle;
    document.title = char.name + ' · STORY ARCHIVE';
    // 언어 버튼 초기 텍스트
    const langBtn = document.getElementById('lang-btn');
    if (langBtn) langBtn.textContent = currentLang === 'ko' ? 'KO / EN' : 'EN / KO';

    // 사진 삽입 (블러 배경 + 메인 이미지)
    const box    = document.getElementById('photo-box');
    const imgSrc = CHAR_IMAGES[currentChar];
    const style  = CHAR_IMG_STYLE[currentChar];
    if (imgSrc) {
        // 블러 배경 (빈 공간 채움)
        const bg = document.createElement('img');
        bg.src = imgSrc;
        bg.className = 'bg-photo';
        bg.style.objectPosition = style.pos;
        box.appendChild(bg);

        // 메인 이미지
        const img = document.createElement('img');
        img.src = imgSrc;
        img.className = 'main-photo';
        img.style.objectFit      = style.fit;
        img.style.objectPosition = style.pos;
        box.appendChild(img);
    }

    pages = char.stories;
    currentPage = 0;
    renderPage(false);
    renderDots();
    // index.html에서 넘어온 언어 설정 반영
    sessionStorage.setItem('savedLang', currentLang);

    // 박스 expand 애니메이션
    const layout = document.querySelector('.story-layout');
    if (layout) {
        layout.classList.remove('expand-in');
        void layout.offsetWidth;
        layout.classList.add('expand-in');
        setTimeout(() => layout.classList.remove('expand-in'), 500);
    }

    resumeMusic();
}

function renderPage(animate) {
    const area = document.getElementById('story-text-area');
    const box = area.closest('.story-box');

    function applyFixedHeight() {
        // 첫 페이지 렌더 후 높이 기록 → 이후 페이지는 그 높이 유지
        if (!box._fixedHeight) {
            box._fixedHeight = box.offsetHeight;
            box.style.height = box._fixedHeight + 'px';
            box.style.minHeight = 'unset';
        }
    }

    if (animate) {
        area.classList.add('fade-out');
        setTimeout(() => {
            area.classList.remove('fade-out');
            setContent(area);
            area.classList.add('fade-in');
            setTimeout(() => area.classList.remove('fade-in'), 220);
            applyFixedHeight();
        }, 160);
    } else {
        setContent(area);
        // 첫 렌더는 레이아웃 완료 후 높이 측정
        requestAnimationFrame(() => applyFixedHeight());
    }
    document.getElementById('page-num').textContent = (currentPage + 1) + ' / ' + pages.length;
    document.getElementById('prev-btn').disabled = currentPage === 0;
    document.getElementById('next-btn').disabled = currentPage === pages.length - 1;
    document.querySelectorAll('.page-dot').forEach((d, i) => d.classList.toggle('active', i === currentPage));
}

function setContent(area) {
    area.innerHTML = '';
    pages[currentPage].split('\n\n').forEach(para => {
        if (para.trim()) {
            const p = document.createElement('p');
            p.textContent = para.trim();
            area.appendChild(p);
        }
    });
}

function renderDots() {
    const c = document.getElementById('page-dots');
    c.innerHTML = '';
    pages.forEach((_, i) => {
        const d = document.createElement('div');
        d.className = 'page-dot' + (i === 0 ? ' active' : '');
        d.onclick = () => { if (i !== currentPage) { currentPage = i; renderPage(true); } };
        c.appendChild(d);
    });
}

function changePage(dir) {
    const n = currentPage + dir;
    if (n < 0 || n >= pages.length) return;
    currentPage = n;
    renderPage(true);
}

document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') changePage(-1);
    if (e.key === 'ArrowRight') changePage(1);
});

init();
</script>
