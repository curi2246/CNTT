<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WORLD MAP</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Serif+KR:wght@400;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --pink:#ff5e5e;
    --mint:#5effeb;
    --bg:#020d0d;
    --gold:#c9a84c;
  }
  body{
    background:var(--bg);
    color:#fff;
    font-family:'Share Tech Mono',monospace;
    overflow:hidden;
    width:100vw;height:100vh;
  }

  /* ── 부팅 오버레이 ── */
  #boot-overlay{
    position:fixed;inset:0;
    background:#000;
    z-index:9999;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:4px;
    transition:transform 0.9s cubic-bezier(0.77,0,0.18,1);
  }
  #boot-overlay.slide-out{ transform:translateX(100%); }
  #boot-lines{
    width:min(500px,85vw);
    max-height:50vh;
    overflow:hidden;
    display:flex;flex-direction:column;
    gap:3px;
  }
  .boot-line{
    font-size:clamp(9px,1.3vw,12px);
    color:#0f0;opacity:0;white-space:nowrap;
    animation:bfade 0.05s forwards;
  }
  @keyframes bfade{to{opacity:1;}}
  .boot-warn{color:#ff5e5e !important;}
  .boot-bar-wrap{width:min(500px,85vw);margin-top:14px;}
  .boot-bar-label{font-size:10px;color:#333;margin-bottom:4px;letter-spacing:2px;}
  .boot-bar{height:3px;background:#111;overflow:hidden;}
  .boot-bar-fill{
    height:100%;background:var(--mint);width:0%;
    transition:width 0.08s linear;
    box-shadow:0 0 6px var(--mint);
  }

  /* ── 메인 레이아웃 ── */
  #map-wrapper{
    width:100%;height:100%;
    display:flex;flex-direction:column;
    opacity:0;transition:opacity 0.5s ease;
    background:radial-gradient(ellipse at 55% 45%, #071422 0%, #020d0d 65%);
  }
  #map-wrapper.visible{opacity:1;}

  /* 헤더 */
  #map-header{
    padding:10px 18px;
    border-bottom:1px solid rgba(94,255,235,0.15);
    display:flex;align-items:center;gap:10px;
    background:rgba(0,0,0,0.5);
    backdrop-filter:blur(6px);
    flex-shrink:0;
  }
  #map-header h2{
    font-family:'Noto Serif KR',serif;
    font-size:clamp(13px,1.8vw,17px);
    color:var(--mint);letter-spacing:5px;
  }
  .hdr-sep{color:#222;margin:0 6px;}
  .hdr-hint{font-size:10px;color:#444;letter-spacing:1px;}

  /* 지도 영역 */
  #map-area{
    flex:1;position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
  }

  /* ── CSS 지형 컨테이너 ── */
  #terrain{
    position:relative;
    width:min(88vw, 660px);
    height:min(75vh, 520px);
    flex-shrink:0;
  }

  /* 바다 배경 (물결 느낌) */
  #terrain::before{
    content:'';
    position:absolute;inset:-30px;
    background:
      radial-gradient(ellipse 80% 60% at 50% 50%, rgba(10,30,60,0.4) 0%, transparent 70%);
    border-radius:50%;
    animation:sea-pulse 4s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes sea-pulse{
    0%,100%{opacity:0.6;}
    50%{opacity:1;}
  }

  /* ── 메인 대륙 ── */
  .continent{
    position:absolute;
    background:linear-gradient(145deg, #2a2010 0%, #1e180c 40%, #241c0e 100%);
    border:2px solid rgba(100,80,40,0.6);
    box-shadow:
      0 0 30px rgba(0,0,0,0.8),
      inset 0 0 40px rgba(0,0,0,0.4);
  }

  /* 메인 대륙 본체 */
  #land-main{
    left:12%;top:8%;
    width:72%;height:75%;
    clip-path: polygon(
      18% 0%, 38% 2%, 55% 0%, 72% 4%, 88% 8%,
      98% 18%, 100% 35%, 96% 52%, 88% 65%,
      78% 78%, 65% 85%, 50% 88%, 38% 85%,
      25% 80%, 15% 68%, 6% 52%, 2% 35%,
      4% 18%, 10% 8%
    );
    background:linear-gradient(145deg, #2e2412 0%, #1e180a 50%, #2a1e0e 100%);
    border:none;
    box-shadow:0 0 40px rgba(0,0,0,0.9), 0 0 80px rgba(0,0,0,0.6);
  }

  /* 대륙 윤곽선 (살짝 어두운 테두리 효과) */
  #land-main::after{
    content:'';
    position:absolute;inset:0;
    clip-path:inherit;
    background:linear-gradient(135deg,
      rgba(255,220,100,0.04) 0%,
      transparent 40%,
      rgba(0,0,0,0.2) 100%
    );
  }

  /* ── 구역별 지형 ── */

  /* 요괴의 숲 - 중앙 상단 초록 숲 */
  #zone-forest{
    position:absolute;
    left:30%;top:12%;
    width:26%;height:30%;
    border-radius:50% 45% 55% 50% / 55% 50% 45% 50%;
    background:radial-gradient(ellipse, rgba(30,80,20,0.85) 0%, rgba(20,55,15,0.7) 60%, transparent 100%);
    border:1px solid rgba(50,120,30,0.4);
    box-shadow:0 0 20px rgba(30,100,20,0.2);
    pointer-events:none;
  }

  /* 친사의 땅 - 우측 상단 산 */
  #zone-angel{
    position:absolute;
    right:8%;top:5%;
    width:22%;height:28%;
    clip-path:polygon(50% 0%,100% 100%,0% 100%);
    background:linear-gradient(180deg, rgba(180,200,255,0.15) 0%, rgba(100,130,200,0.08) 100%);
    filter:blur(2px);
    pointer-events:none;
  }
  #zone-angel-snow{
    position:absolute;
    right:10%;top:5%;
    width:18%;height:14%;
    clip-path:polygon(50% 0%,80% 60%,20% 60%);
    background:rgba(230,240,255,0.12);
    pointer-events:none;
  }

  /* 악마의 영역 - 우측 화산 */
  #zone-demon{
    position:absolute;
    right:5%;top:30%;
    width:20%;height:28%;
    border-radius:40% 40% 50% 50% / 30% 30% 50% 50%;
    background:radial-gradient(ellipse at 50% 80%, rgba(180,40,10,0.4) 0%, rgba(120,20,5,0.25) 50%, transparent 100%);
    border:1px solid rgba(180,60,10,0.3);
    box-shadow:0 0 20px rgba(180,40,0,0.15);
    pointer-events:none;
  }

  /* 변칙 구역 - 좌측 균열 지형 */
  #zone-glitch{
    position:absolute;
    left:2%;top:35%;
    width:22%;height:28%;
    clip-path:polygon(10% 0%,90% 5%,100% 40%,85% 95%,15% 100%,0% 60%,5% 20%);
    background:linear-gradient(135deg, rgba(60,0,80,0.4) 0%, rgba(30,0,40,0.5) 100%);
    border:1px solid rgba(150,0,180,0.2);
    box-shadow:0 0 15px rgba(150,0,200,0.1);
    pointer-events:none;
    animation:glitch-zone 3s ease-in-out infinite;
  }
  @keyframes glitch-zone{
    0%,100%{filter:none;opacity:1;}
    92%{filter:none;opacity:1;}
    93%{filter:hue-rotate(90deg) brightness(1.5);opacity:0.8;}
    94%{filter:none;opacity:1;}
    96%{filter:hue-rotate(180deg) brightness(0.7);opacity:0.6;}
    97%{filter:none;opacity:1;}
  }

  /* 게약의 도시 - 중앙 */
  #zone-city{
    position:absolute;
    left:40%;top:42%;
    width:20%;height:22%;
    border-radius:30%;
    background:radial-gradient(ellipse, rgba(40,80,120,0.3) 0%, rgba(20,50,80,0.15) 70%, transparent 100%);
    pointer-events:none;
  }

  /* ── 작은 섬 ── */
  #island-left{
    position:absolute;
    left:2%;top:55%;
    width:10%;height:14%;
    clip-path:polygon(20% 0%,80% 5%,100% 50%,70% 100%,10% 95%,0% 45%);
    background:linear-gradient(145deg, #2a2010, #1a1208);
    box-shadow:0 0 15px rgba(0,0,0,0.7);
  }
  #island-bottom{
    position:absolute;
    left:38%;top:82%;
    width:16%;height:14%;
    clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%);
    background:linear-gradient(145deg, #1e2a14, #141e0a);
    box-shadow:0 0 15px rgba(0,0,0,0.7);
  }
  #island-bottom::after{
    content:'';
    position:absolute;
    left:20%;top:10%;
    width:15%;height:80%;
    background:rgba(80,100,60,0.3);
    border-radius:20%;
  }

  /* ── 핀 ── */
  .map-pin{
    position:absolute;
    transform:translate(-50%,-50%);
    cursor:pointer;
    z-index:20;
  }
  .pin-ring{
    position:relative;
    width:20px;height:20px;
  }
  .pin-outer{
    position:absolute;inset:0;
    border-radius:50%;
    border:2px solid var(--gold);
    background:rgba(10,10,20,0.8);
    box-shadow:0 0 0 0 rgba(201,168,76,0.5);
    animation:pring 2.5s ease-in-out infinite;
    transition:transform 0.2s,background 0.2s;
  }
  .pin-inner{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:7px;height:7px;
    border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 5px var(--gold);
  }
  @keyframes pring{
    0%,100%{box-shadow:0 0 0 0 rgba(201,168,76,0.5);}
    50%{box-shadow:0 0 0 7px rgba(201,168,76,0);}
  }
  .map-pin:hover .pin-outer{transform:scale(1.4);background:rgba(201,168,76,0.2);}
  .map-pin:hover .pin-inner{box-shadow:0 0 12px var(--gold);}

  /* 핀 라벨 */
  .pin-label{
    position:absolute;
    bottom:24px;left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.9);
    border:1px solid rgba(201,168,76,0.5);
    color:var(--gold);
    font-size:10px;padding:3px 8px;
    white-space:nowrap;pointer-events:none;
    opacity:0;transition:opacity 0.2s;
    letter-spacing:1px;
  }
  .map-pin:hover .pin-label{opacity:1;}

  /* 글리치 핀 */
  .pin-glitch .pin-outer{
    border-color:var(--pink);
    animation:pring-red 1.5s ease-in-out infinite;
  }
  .pin-glitch .pin-inner{
    background:var(--pink);
    box-shadow:0 0 6px var(--pink);
    animation:gdot 0.25s infinite;
  }
  .pin-glitch .pin-label{border-color:rgba(255,94,94,0.5);color:var(--pink);}
  @keyframes pring-red{
    0%,100%{box-shadow:0 0 0 0 rgba(255,94,94,0.5);}
    50%{box-shadow:0 0 0 7px rgba(255,94,94,0);}
  }
  @keyframes gdot{
    0%{transform:translate(-50%,-50%);}
    33%{transform:translate(-50%,-50%) translate(1px,-1px);}
    66%{transform:translate(-50%,-50%) translate(-1px,1px);}
    100%{transform:translate(-50%,-50%);}
  }

  /* ── 팝업 ── */
  #popup{
    position:absolute;inset:0;z-index:100;
    display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,0.65);
    opacity:0;pointer-events:none;
    transition:opacity 0.3s;
    backdrop-filter:blur(3px);
  }
  #popup.open{opacity:1;pointer-events:all;}
  #popup-card{
    background:#050f0f;
    border:1px solid rgba(94,255,235,0.25);
    width:min(460px,90vw);
    max-height:78vh;
    overflow-y:auto;
    position:relative;
    transform:translateY(18px) scale(0.96);
    transition:transform 0.35s cubic-bezier(0.34,1.5,0.64,1);
    box-shadow:0 0 50px rgba(94,255,235,0.08),0 20px 60px rgba(0,0,0,0.6);
  }
  #popup.open #popup-card{transform:translateY(0) scale(1);}
  #popup-banner{
    width:100%;height:120px;
    position:relative;overflow:hidden;
    display:flex;align-items:flex-end;
  }
  #popup-banner-bg{position:absolute;inset:0;background-size:cover;background-position:center;}
  #popup-banner-grad{position:absolute;inset:0;background:linear-gradient(to top,#050f0f 0%,transparent 65%);}
  .banner-code{
    position:relative;z-index:1;
    padding:0 16px 7px;
    font-size:9px;color:var(--mint);
    letter-spacing:3px;text-shadow:0 0 8px var(--mint);
  }
  #popup-body{padding:12px 16px 18px;}
  #popup-name{
    font-family:'Noto Serif KR',serif;
    font-size:clamp(15px,2.2vw,20px);
    color:#fff;margin-bottom:3px;
  }
  #popup-sub{font-size:10px;color:#555;letter-spacing:2px;margin-bottom:12px;font-style:italic;}
  #popup-desc{
    font-size:clamp(11px,1.4vw,13px);color:#aaa;line-height:1.85;
    border-left:2px solid rgba(94,255,235,0.25);
    padding-left:11px;margin-bottom:12px;
    font-family:'Noto Serif KR',serif;
  }
  .pstat{
    display:flex;align-items:center;gap:10px;
    background:rgba(94,255,235,0.04);
    border:1px solid rgba(94,255,235,0.1);
    padding:8px 12px;margin-bottom:6px;
  }
  .pstat-ico{font-size:15px;flex-shrink:0;}
  .pstat-lbl{font-size:9px;color:var(--mint);letter-spacing:2px;margin-bottom:2px;}
  .pstat-val{font-size:12px;color:#ccc;font-family:'Noto Serif KR',serif;}
  .d-low{color:#5eff8a;}.d-mid{color:#ffd75e;}.d-high{color:#ff5e5e;}.d-ex{color:#ff44ff;}.d-unk{color:#888;}
  #popup-close{
    position:absolute;top:8px;right:8px;
    width:26px;height:26px;
    background:rgba(0,0,0,0.7);
    border:1px solid rgba(255,255,255,0.15);
    color:#888;font-size:13px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    z-index:200;transition:all 0.2s;
  }
  #popup-close:hover{background:rgba(255,94,94,0.25);color:#fff;}

  /* 하단 정보 */
  #info-bar{
    position:absolute;bottom:8px;left:0;right:0;
    display:flex;justify-content:space-between;
    padding:0 14px;pointer-events:none;z-index:5;
  }
  .info-txt{font-size:9px;color:#1e1e1e;letter-spacing:1px;}

  /* 스캔라인 */
  #scanline{
    position:fixed;inset:0;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.06) 2px,rgba(0,0,0,0.06) 4px);
    z-index:8000;pointer-events:none;
  }

  ::-webkit-scrollbar{width:3px;}
  ::-webkit-scrollbar-thumb{background:#222;}
</style>
</head>
<body>
<div id="scanline"></div>

<!-- 부팅 -->
<div id="boot-overlay">
  <div id="boot-lines"></div>
  <div class="boot-bar-wrap">
    <div class="boot-bar-label">LOADING WORLD DATA</div>
    <div class="boot-bar"><div class="boot-bar-fill" id="bfill"></div></div>
  </div>
</div>

<!-- 메인 -->
<div id="map-wrapper">
  <div id="map-header">
    <h2>대륙 지도</h2>
    <span class="hdr-sep">|</span>
    <span class="hdr-hint">핀을 선택하여 지역 정보를 확인하세요</span>
  </div>

  <div id="map-area">
    <!-- CSS 지형 -->
    <div id="terrain">
      <div id="land-main"></div>
      <div id="zone-forest"></div>
      <div id="zone-angel"></div>
      <div id="zone-angel-snow"></div>
      <div id="zone-demon"></div>
      <div id="zone-glitch"></div>
      <div id="zone-city"></div>
      <div id="island-left"></div>
      <div id="island-bottom"></div>
      <!-- 핀은 JS로 생성 -->
    </div>

    <div id="info-bar">
      <span class="info-txt" id="coord-txt">LAT: —  LON: —</span>
      <span class="info-txt">WORLD_MAP.exe v1.0</span>
    </div>

    <!-- 팝업 -->
    <div id="popup">
      <div id="popup-card">
        <button id="popup-close" onclick="closePopup()">✕</button>
        <div id="popup-banner">
          <div id="popup-banner-bg"></div>
          <div id="popup-banner-grad"></div>
          <div class="banner-code">● <span id="p-code">—</span></div>
        </div>
        <div id="popup-body">
          <div id="popup-name">—</div>
          <div id="popup-sub">—</div>
          <div id="popup-desc">—</div>
          <div id="popup-stats"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const LOCS = [
  {
    code:"SECTOR-01", name:"요괴의 땅 / 구미의 숲",
    sub:"Fox's Haunt · Glitch-infested Forest",
    desc:"구미호와 요괴들이 서식하는 깊은 숲. 나무들 사이로 글리치가 흘러 공간이 뒤틀려 있으며, 나침반조차 정상 작동을 보장할 수 없다. 큐로의 원래 서식지와 가까운 것으로 추정되는 지역.",
    guardian:"구미호 무리 (미확인 개체 다수)", danger:"높음", dc:"d-high",
    // terrain 컨테이너 기준 % 좌표
    px:43, py:25,
    bg:"linear-gradient(135deg,#0d1a0d,#1a1200)", glitch:false
  },
  {
    code:"SECTOR-02", name:"친사의 땅 / 빛의 성역",
    sub:"Angel's Domain · Sanctuary of Light",
    desc:"천사들이 거주하는 고지대 성역. 접근 자체가 제한되어 있으며 시로(Shiro)가 간헐적으로 목격된 구역이다. 헤일로에 덮인 글리치와 관련된 이상 현상이 보고된 바 있다.",
    guardian:"시로 (Shiro) — 간헐적 관측", danger:"미지수", dc:"d-unk",
    px:76, py:18,
    bg:"linear-gradient(135deg,#080814,#0d0d20)", glitch:false
  },
  {
    code:"SECTOR-03", name:"악마의 영역 / 심연의 제단",
    sub:"Demon's Realm · Altar of the Abyss",
    desc:"순수 악마 계열 존재들의 본거지. 키스네와 같은 순수 악마들이 계약을 맺는 제단이 있다고 전해진다. 깊은 곳에는 이름 없는 존재들과의 계약 흔적이 새겨져 있다.",
    guardian:"계약의 원칙 (현상체)", danger:"매우 높음", dc:"d-high",
    px:83, py:46,
    bg:"linear-gradient(135deg,#1a0505,#0d0005)", glitch:false
  },
  {
    code:"SECTOR-04", name:"변칙과 왜곡의 구역",
    sub:"Glitch Zone · Anomaly District",
    desc:"글리치 현상이 가장 극심하게 발현되는 지역. 공간 자체가 불안정하며 일반적인 물리 법칙이 적용되지 않는다. 큐로?(GLITCH_DATA)의 잔상이 관측된 유일한 구역. 접근 시 심각한 인지 왜곡 보고됨.",
    guardian:"미식별 글리치 개체", danger:"극한", dc:"d-ex",
    px:13, py:53,
    bg:"linear-gradient(135deg,#0d000d,#050005)", glitch:true
  },
  {
    code:"SECTOR-05", name:"게약의 도시",
    sub:"City of Contracts · Central Nexus",
    desc:"대륙 중앙에 위치한 계약 거점 도시. 다양한 종족과 존재들이 계약을 위해 모이는 중립 지대. 악마, 천사, 인간, 요괴 모두가 공식적으로 입장 가능한 유일한 공간이다.",
    guardian:"길드 연합 (복수 세력)", danger:"보통", dc:"d-mid",
    px:50, py:56,
    bg:"linear-gradient(135deg,#080f14,#0a0f18)", glitch:false
  },
  {
    code:"SECTOR-06", name:"고립된 시간의 섬 / 영원의 구원",
    sub:"Isle of Frozen Time · Salvation of Eternity",
    desc:"리셋(Reset) 현상의 영향을 받지 않는 것으로 추정되는 고립된 섬. 노에인(Noein)과 관련된 기록이 일부 남아 있다. 리에(Leay)가 이곳을 방문한 기록이 존재하나 세부 내용은 삭제됨.",
    guardian:"토리 (Tory) — 미확인", danger:"불명", dc:"d-unk",
    px:46, py:90,
    bg:"linear-gradient(135deg,#080f08,#050a05)", glitch:false
  }
];

const BOOT=[
  "INITIALIZING WORLD_MAP.exe...",
  "MOUNTING SPATIAL DATABASE...",
  "LOADING TERRAIN DATA.............. OK",
  "LOADING SECTOR RECORDS............. OK",
  "DECRYPTING LOCATION MARKERS........ OK",
  "WARNING: SECTOR-04 DATA CORRUPTED",
  "WARNING: ANOMALY ENTITIES DETECTED",
  "BYPASSING CORRUPTION LAYER......... OK",
  "RENDERING CSS TERRAIN LAYER........ OK",
  "PLACING SECTOR MARKERS............. OK",
  "ALL SYSTEMS READY.",
];

async function runBoot(){
  const lines=document.getElementById("boot-lines");
  const fill=document.getElementById("bfill");
  for(let i=0;i<BOOT.length;i++){
    await sleep(80+Math.random()*60);
    const el=document.createElement("div");
    el.className="boot-line"+(BOOT[i].startsWith("WARNING")?" boot-warn":"");
    el.style.animationDelay="0s";
    el.textContent="> "+BOOT[i];
    lines.appendChild(el);
    fill.style.width=((i+1)/BOOT.length*100)+"%";
  }
  await sleep(350);
  document.getElementById("boot-overlay").classList.add("slide-out");
  await sleep(920);
  document.getElementById("boot-overlay").style.display="none";
  document.getElementById("map-wrapper").classList.add("visible");
  initMap();
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function initMap(){
  const terrain=document.getElementById("terrain");
  const area=document.getElementById("map-area");

  LOCS.forEach(loc=>{
    const pin=document.createElement("div");
    pin.className="map-pin"+(loc.glitch?" pin-glitch":"");
    pin.innerHTML=`
      <div class="pin-ring">
        <div class="pin-outer"></div>
        <div class="pin-inner"></div>
      </div>
      <div class="pin-label">${loc.name.split("/")[0].trim()}</div>
    `;
    pin.style.left=loc.px+"%";
    pin.style.top=loc.py+"%";
    pin.addEventListener("click",()=>openPopup(loc));
    terrain.appendChild(pin);
  });

  // 좌표 표시
  terrain.addEventListener("mousemove",e=>{
    const r=terrain.getBoundingClientRect();
    const rx=((e.clientX-r.left)/r.width*100).toFixed(1);
    const ry=((e.clientY-r.top)/r.height*100).toFixed(1);
    document.getElementById("coord-txt").textContent="LAT: "+ry+"  LON: "+rx;
  });
}

function openPopup(loc){
  document.getElementById("p-code").textContent=loc.code;
  document.getElementById("popup-name").textContent=loc.name;
  document.getElementById("popup-sub").textContent=loc.sub;
  document.getElementById("popup-desc").textContent=loc.desc;
  document.getElementById("popup-banner-bg").style.background=loc.bg;
  document.getElementById("popup-stats").innerHTML=`
    <div class="pstat">
      <div class="pstat-ico">👁</div>
      <div>
        <div class="pstat-lbl">GUARDIAN / OBSERVED ENTITY</div>
        <div class="pstat-val">${loc.guardian}</div>
      </div>
    </div>
    <div class="pstat">
      <div class="pstat-ico">⚠</div>
      <div>
        <div class="pstat-lbl">DANGER LEVEL</div>
        <div class="pstat-val ${loc.dc}">${loc.danger}</div>
      </div>
    </div>
  `;
  document.getElementById("popup").classList.add("open");
}
function closePopup(){document.getElementById("popup").classList.remove("open");}
document.getElementById("popup").addEventListener("click",e=>{
  if(e.target===document.getElementById("popup"))closePopup();
});

runBoot();
</script>
</body>
</html>
