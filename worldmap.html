<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WORLD MAP</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Serif+KR:wght@400;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --pink:#ff5e5e;
    --mint:#5effeb;
    --bg:#020d0d;
    --gold:#c9a84c;
  }
  html,body{
    width:100%;height:100%;
    background:#000;
    color:#fff;
    font-family:'Share Tech Mono',monospace;
    overflow:hidden;
  }

  /* ══════════════════════════════
     부팅 오버레이
  ══════════════════════════════ */
  #boot-overlay{
    position:fixed;inset:0;
    background:#000;
    z-index:9999;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:0;
  }
  /* 옛날 TV 켜지는 효과 - 세로로 얇아지다가 수평선만 남고 사라짐 */
  #boot-overlay.tv-off{
    animation: tv-turn-on-reverse 0.6s cubic-bezier(0.23,1,0.32,1) forwards;
  }
  @keyframes tv-turn-on-reverse {
    0%   { clip-path: inset(0 0 0 0);         opacity:1; }
    40%  { clip-path: inset(49% 0 49% 0);     opacity:1; }
    70%  { clip-path: inset(49.8% 0 49.8% 0); opacity:1; filter:brightness(3); }
    100% { clip-path: inset(50% 0 50% 0);     opacity:0; filter:brightness(0); }
  }

  #boot-lines{
    width:min(600px,85vw);
    max-height:55vh;
    overflow:hidden;
    display:flex;flex-direction:column;
    gap:6px;
    font-size:clamp(11px,1.5vw,14px);
    letter-spacing:1px;
  }
  .boot-line{
    color:var(--mint);
    opacity:0;
    animation:bfade 0.03s forwards;
    white-space:nowrap;
  }
  .boot-line-sub{
    color:var(--mint);
    opacity:0;
    animation:bfade 0.03s forwards;
    white-space:nowrap;
    padding-left:20px;
    font-size:0.9em;
  }
  @keyframes bfade{to{opacity:1;}}
  .boot-warn{color:#ff5e5e !important;}
  .boot-ok{color:#5eff8a !important;}

  .boot-bar-wrap{
    width:min(600px,85vw);
    margin-top:20px;
  }
  .boot-bar-label{
    font-size:11px;color:#2a2a2a;
    margin-bottom:5px;letter-spacing:3px;
  }
  .boot-bar{height:2px;background:#0a0a0a;overflow:hidden;}
  .boot-bar-fill{
    height:100%;background:var(--mint);width:0%;
    transition:width 0.1s linear;
    box-shadow:0 0 8px var(--mint);
  }

  /* ══════════════════════════════
     TV 켜지는 인트로 — 지도 등장
  ══════════════════════════════ */
  #map-wrapper{
    position:fixed;inset:0;
    display:flex;flex-direction:column;
    background:#000;
    /* 처음엔 가로로 완전히 찌그러진 상태 */
    clip-path: inset(50% 0 50% 0);
    opacity:0;
  }
  #map-wrapper.tv-on{
    animation: tv-expand 0.7s cubic-bezier(0.16,1,0.3,1) forwards;
  }
  @keyframes tv-expand {
    0%   { clip-path: inset(50% 0 50% 0);  opacity:1; filter:brightness(3) saturate(0); }
    20%  { clip-path: inset(49% 0 49% 0);  opacity:1; filter:brightness(2) saturate(0); }
    50%  { clip-path: inset(20% 0 20% 0);  opacity:1; filter:brightness(1.3) saturate(0.5); }
    80%  { clip-path: inset(2% 0 2% 0);    opacity:1; filter:brightness(1.1) saturate(0.9); }
    100% { clip-path: inset(0% 0 0% 0);    opacity:1; filter:brightness(1) saturate(1); }
  }

  /* ══════════════════════════════
     헤더
  ══════════════════════════════ */
  #map-header{
    padding:10px 20px;
    border-bottom:1px solid rgba(94,255,235,0.2);
    display:flex;align-items:center;justify-content:space-between;
    background:rgba(0,0,0,0.8);
    backdrop-filter:blur(4px);
    flex-shrink:0;
    letter-spacing:3px;
  }
  .hdr-left{
    display:flex;align-items:center;gap:12px;
    font-size:clamp(11px,1.4vw,13px);
    color:var(--mint);
  }
  .hdr-left span{color:#333;}
  #map-header .close-btn{
    font-size:11px;color:#333;
    letter-spacing:2px;
    border:1px solid #222;
    padding:4px 10px;
    cursor:default;
  }

  /* ══════════════════════════════
     지도 영역 — 화면 꽉
  ══════════════════════════════ */
  #map-area{
    flex:1;
    position:relative;
    overflow:hidden;
    background:
      radial-gradient(ellipse 70% 60% at 60% 45%, #0a1520 0%, #000 70%);
  }

  /* 지형 — 화면 꽉 채우되 비율 유지 */
  #terrain{
    position:absolute;
    /* 가운데 정렬, 최대한 크게 */
    top:50%; left:50%;
    transform:translate(-50%, -50%);
    width: min(90vw, calc(90vh * 1.15));
    height: min(90vh, calc(90vw / 1.15));
    aspect-ratio: 1.15 / 1;
  }

  /* ── 메인 대륙 ── */
  #land-main{
    position:absolute;
    left:28%; top:5%;
    width:68%; height:82%;
    clip-path:polygon(
      18% 0%, 40% 1%, 58% 0%, 74% 4%, 90% 8%,
      99% 20%, 100% 38%, 96% 55%, 87% 68%,
      75% 79%, 60% 86%, 44% 88%, 30% 83%,
      18% 72%, 8% 55%, 2% 38%, 4% 20%, 10% 8%
    );
    background:linear-gradient(145deg, #3a2e14 0%, #2a2010 40%, #332818 100%);
    box-shadow:
      0 0 60px rgba(0,0,0,0.95),
      0 0 120px rgba(0,0,0,0.7),
      inset 0 0 30px rgba(0,0,0,0.3);
  }
  /* 대륙 가장자리 질감 */
  #land-main::after{
    content:'';
    position:absolute;inset:0;
    background:
      radial-gradient(ellipse 40% 30% at 70% 30%, rgba(255,230,140,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 40% 60%, rgba(0,0,0,0.15) 0%, transparent 70%);
  }

  /* ── 지형 요소들 ── */
  /* 요괴의 숲 */
  #zone-forest{
    position:absolute;
    left:44%; top:12%;
    width:24%; height:32%;
    border-radius:45% 55% 50% 50% / 55% 45% 55% 45%;
    background:radial-gradient(ellipse at 50% 40%,
      rgba(25,75,18,0.9) 0%,
      rgba(18,58,12,0.75) 50%,
      rgba(10,35,8,0.4) 100%
    );
    box-shadow:inset 0 0 20px rgba(0,50,0,0.4), 0 0 15px rgba(20,80,10,0.15);
  }
  #zone-forest::before{
    content:'';position:absolute;inset:5%;
    border-radius:inherit;
    background:radial-gradient(ellipse at 40% 35%, rgba(40,110,25,0.4) 0%, transparent 60%);
  }

  /* 친사의 땅 — 우상단 산 */
  #zone-mountain{
    position:absolute;
    right:2%; top:2%;
    width:24%; height:30%;
  }
  /* 산봉우리 1 */
  #zone-mountain::before{
    content:'';position:absolute;
    left:20%; top:0%;
    width:60%; height:100%;
    clip-path:polygon(50% 0%, 95% 100%, 5% 100%);
    background:linear-gradient(180deg, #888 0%, #666 40%, #444 100%);
    box-shadow:0 0 20px rgba(0,0,0,0.5);
  }
  /* 눈 */
  #zone-mountain::after{
    content:'';position:absolute;
    left:32%; top:0%;
    width:36%; height:35%;
    clip-path:polygon(50% 0%, 85% 100%, 15% 100%);
    background:rgba(220,230,255,0.85);
  }
  /* 호수 */
  #zone-lake{
    position:absolute;
    right:8%; top:28%;
    width:14%; height:9%;
    border-radius:50%;
    background:radial-gradient(ellipse, rgba(60,120,180,0.7) 0%, rgba(30,70,120,0.5) 100%);
    box-shadow:0 0 10px rgba(60,120,200,0.2);
  }

  /* 악마의 영역 — 우측 화산 */
  #zone-volcano{
    position:absolute;
    right:3%; top:30%;
    width:22%; height:30%;
  }
  #zone-volcano::before{
    content:'';position:absolute;inset:0;
    clip-path:polygon(50% 0%, 100% 100%, 0% 100%);
    background:linear-gradient(180deg, #5a2010 0%, #3a1508 40%, #2a1005 100%);
  }
  #zone-volcano::after{
    content:'';position:absolute;
    left:35%; top:0%;
    width:30%; height:40%;
    clip-path:polygon(50% 0%, 85% 100%, 15% 100%);
    background:radial-gradient(ellipse at 50% 30%, rgba(255,80,0,0.7) 0%, rgba(200,40,0,0.4) 60%, transparent 100%);
    animation:volcano-glow 2s ease-in-out infinite;
  }
  @keyframes volcano-glow{
    0%,100%{opacity:0.7; filter:brightness(1);}
    50%{opacity:1; filter:brightness(1.4);}
  }

  /* 변칙 구역 — 좌측 균열 */
  #zone-anomaly{
    position:absolute;
    left:2%; top:30%;
    width:22%; height:30%;
    clip-path:polygon(8% 0%,92% 3%,100% 45%,88% 97%,12% 100%,0% 55%,3% 18%);
    background:linear-gradient(135deg, #1a0820 0%, #100515 100%);
    box-shadow:inset 0 0 20px rgba(100,0,150,0.3);
    animation:anomaly-flicker 4s ease-in-out infinite;
  }
  @keyframes anomaly-flicker{
    0%,100%{filter:none;}
    94%{filter:none;}
    95%{filter:hue-rotate(90deg) brightness(1.8) saturate(2);}
    96%{filter:none;}
    98%{filter:hue-rotate(180deg) brightness(0.6);}
    99%{filter:none;}
  }
  /* 균열 라인들 */
  #zone-anomaly::before{
    content:'';position:absolute;inset:0;
    background:
      linear-gradient(125deg, transparent 45%, rgba(100,150,255,0.2) 46%, transparent 47%),
      linear-gradient(145deg, transparent 30%, rgba(100,150,255,0.15) 31%, transparent 32%),
      linear-gradient(100deg, transparent 55%, rgba(150,100,255,0.1) 56%, transparent 57%);
  }

  /* 게약의 도시 — 중앙 */
  #zone-city{
    position:absolute;
    left:44%; top:45%;
    width:18%; height:22%;
    border-radius:40%;
    background:radial-gradient(ellipse, rgba(40,70,100,0.5) 0%, rgba(20,40,70,0.3) 70%, transparent 100%);
  }

  /* ── 작은 섬들 ── */
  #island-small{
    position:absolute;
    left:20%; top:72%;
    width:8%; height:12%;
    clip-path:polygon(20% 0%,80% 5%,100% 55%,65% 100%,10% 95%,0% 45%);
    background:linear-gradient(145deg, #2a2010, #1a1208);
    box-shadow:0 0 15px rgba(0,0,0,0.8);
  }
  #island-bottom{
    position:absolute;
    left:52%; top:88%;
    width:16%; height:14%;
    clip-path:polygon(20% 0%,80% 0%,100% 50%,80% 100%,20% 100%,0% 50%);
    background:linear-gradient(145deg, #1e2a14, #141e0a);
    box-shadow:0 0 15px rgba(0,0,0,0.8);
  }

  /* 지형 텍스처 오버레이 */
  #terrain-texture{
    position:absolute;inset:0;
    pointer-events:none;z-index:1;
    background:
      repeating-linear-gradient(
        45deg,
        transparent,
        transparent 60px,
        rgba(0,0,0,0.015) 60px,
        rgba(0,0,0,0.015) 61px
      );
  }

  /* ══════════════════════════════
     핀
  ══════════════════════════════ */
  .map-pin{
    position:absolute;
    transform:translate(-50%,-50%);
    cursor:pointer;
    z-index:30;
  }
  .pin-wrap{
    display:flex;flex-direction:column;align-items:center;
    gap:3px;
  }
  .pin-dot-wrap{
    position:relative;
    width:16px;height:16px;
  }
  .pin-outer{
    position:absolute;inset:0;
    border-radius:50%;
    border:1.5px solid var(--gold);
    background:rgba(5,5,10,0.85);
    animation:pring 2.5s ease-in-out infinite;
    transition:transform 0.2s, background 0.2s;
  }
  .pin-inner{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:6px;height:6px;
    border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 5px var(--gold);
  }
  @keyframes pring{
    0%,100%{box-shadow:0 0 0 0 rgba(201,168,76,0.5);}
    50%{box-shadow:0 0 0 6px rgba(201,168,76,0);}
  }
  .pin-code{
    font-size:9px;color:#444;letter-spacing:1px;
    white-space:nowrap;
    transition:color 0.2s;
  }
  .map-pin:hover .pin-outer{transform:scale(1.5);background:rgba(201,168,76,0.25);}
  .map-pin:hover .pin-inner{box-shadow:0 0 10px var(--gold);}
  .map-pin:hover .pin-code{color:var(--gold);}

  /* 글리치 핀 */
  .pin-glitch .pin-outer{
    border-color:var(--pink);
    animation:pring-r 1.5s ease-in-out infinite;
  }
  .pin-glitch .pin-inner{
    background:var(--pink);
    box-shadow:0 0 5px var(--pink);
    animation:gdot 0.2s infinite;
  }
  .pin-glitch .pin-code{color:#441010;}
  @keyframes pring-r{
    0%,100%{box-shadow:0 0 0 0 rgba(255,94,94,0.5);}
    50%{box-shadow:0 0 0 6px rgba(255,94,94,0);}
  }
  @keyframes gdot{
    0%{transform:translate(-50%,-50%);}
    33%{transform:translate(-50%,-50%) translate(1.5px,-1px);}
    66%{transform:translate(-50%,-50%) translate(-1px,1.5px);}
  }

  /* 민트 핀 (특수) */
  .pin-mint .pin-outer{border-color:var(--mint);animation:pring-m 2s infinite;}
  .pin-mint .pin-inner{background:var(--mint);box-shadow:0 0 5px var(--mint);}
  .pin-mint .pin-code{color:#0a2a2a;}
  @keyframes pring-m{
    0%,100%{box-shadow:0 0 0 0 rgba(94,255,235,0.4);}
    50%{box-shadow:0 0 0 6px rgba(94,255,235,0);}
  }

  /* ══════════════════════════════
     팝업
  ══════════════════════════════ */
  #popup{
    position:absolute;inset:0;z-index:100;
    display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,0.7);
    opacity:0;pointer-events:none;
    transition:opacity 0.3s;
    backdrop-filter:blur(4px);
  }
  #popup.open{opacity:1;pointer-events:all;}
  #popup-card{
    background:#050f0f;
    border:1px solid rgba(94,255,235,0.2);
    width:min(500px,88vw);
    max-height:80vh;
    overflow-y:auto;
    position:relative;
    transform:translateY(16px) scale(0.97);
    transition:transform 0.35s cubic-bezier(0.34,1.5,0.64,1);
    box-shadow:0 0 60px rgba(94,255,235,0.07), 0 24px 70px rgba(0,0,0,0.7);
  }
  #popup.open #popup-card{transform:translateY(0) scale(1);}

  #popup-banner{
    width:100%;height:130px;
    position:relative;overflow:hidden;display:flex;align-items:flex-end;
  }
  #popup-banner-bg{position:absolute;inset:0;}
  #popup-banner-grad{
    position:absolute;inset:0;
    background:linear-gradient(to top,#050f0f 0%,transparent 60%);
  }
  .banner-code{
    position:relative;z-index:1;padding:0 18px 8px;
    font-size:9px;color:var(--mint);letter-spacing:3px;
    text-shadow:0 0 8px var(--mint);
  }
  #popup-body{padding:14px 18px 20px;}
  #popup-name{
    font-family:'Noto Serif KR',serif;
    font-size:clamp(16px,2.3vw,22px);
    color:#fff;margin-bottom:3px;
  }
  #popup-sub{font-size:10px;color:#444;letter-spacing:2px;margin-bottom:14px;font-style:italic;}
  #popup-desc{
    font-size:clamp(11px,1.4vw,13px);color:#999;line-height:1.9;
    border-left:2px solid rgba(94,255,235,0.2);
    padding-left:12px;margin-bottom:14px;
    font-family:'Noto Serif KR',serif;
  }
  .pstat{
    display:flex;align-items:center;gap:10px;
    background:rgba(94,255,235,0.03);
    border:1px solid rgba(94,255,235,0.08);
    padding:9px 13px;margin-bottom:7px;
  }
  .pstat-ico{font-size:15px;flex-shrink:0;}
  .pstat-lbl{font-size:9px;color:var(--mint);letter-spacing:2px;margin-bottom:2px;}
  .pstat-val{font-size:13px;color:#bbb;font-family:'Noto Serif KR',serif;}
  .d-low{color:#5eff8a;}.d-mid{color:#ffd75e;}.d-high{color:#ff5e5e;}.d-ex{color:#ff44ff;}.d-unk{color:#666;}
  #popup-close{
    position:absolute;top:8px;right:8px;
    width:28px;height:28px;
    background:rgba(0,0,0,0.8);
    border:1px solid rgba(255,255,255,0.1);
    color:#555;font-size:13px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    z-index:200;transition:all 0.2s;
  }
  #popup-close:hover{background:rgba(255,94,94,0.2);color:#fff;}

  /* 하단 정보 */
  #info-bar{
    position:absolute;bottom:8px;left:0;right:0;
    display:flex;justify-content:space-between;
    padding:0 16px;pointer-events:none;z-index:5;
  }
  .info-txt{font-size:9px;color:#1a1a1a;letter-spacing:1px;}

  /* 스캔라인 */
  #scanline{
    position:fixed;inset:0;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.06) 2px,rgba(0,0,0,0.06) 4px);
    z-index:8000;pointer-events:none;
  }
  ::-webkit-scrollbar{width:3px;}
  ::-webkit-scrollbar-thumb{background:#1a1a1a;}
</style>
</head>
<body>
<div id="scanline"></div>

<!-- 부팅 -->
<div id="boot-overlay">
  <div id="boot-lines"></div>
  <div class="boot-bar-wrap">
    <div class="boot-bar-label">로딩 중</div>
    <div class="boot-bar"><div class="boot-bar-fill" id="bfill"></div></div>
  </div>
</div>

<!-- 메인 -->
<div id="map-wrapper">
  <div id="map-header">
    <div class="hdr-left">
      ◆ WORLD MAP <span>—</span> CONTINENTAL SECTOR
    </div>
    <div class="close-btn" onclick="if(window.parent&&window.parent.document.getElementById('map-fullscreen-overlay'))window.parent.document.getElementById('map-fullscreen-overlay').remove();" style="cursor:pointer;">✕ CLOSE</div>
  </div>

  <div id="map-area">
    <div id="terrain">
      <!-- 지형 레이어 -->
      <div id="land-main"></div>
      <div id="zone-forest"></div>
      <div id="zone-mountain"></div>
      <div id="zone-lake"></div>
      <div id="zone-volcano"></div>
      <div id="zone-anomaly"></div>
      <div id="zone-city"></div>
      <div id="island-small"></div>
      <div id="island-bottom"></div>
      <div id="terrain-texture"></div>
      <!-- 핀은 JS -->
    </div>

    <div id="info-bar">
      <span class="info-txt" id="coord-txt">LAT: —  LON: —</span>
      <span class="info-txt">WORLD_MAP.exe  v1.0</span>
    </div>

    <!-- 팝업 -->
    <div id="popup">
      <div id="popup-card">
        <button id="popup-close" onclick="closePopup()">✕</button>
        <div id="popup-banner">
          <div id="popup-banner-bg"></div>
          <div id="popup-banner-grad"></div>
          <div class="banner-code">● <span id="p-code">—</span></div>
        </div>
        <div id="popup-body">
          <div id="popup-name">—</div>
          <div id="popup-sub">—</div>
          <div id="popup-desc">—</div>
          <div id="popup-stats"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const LOCS = [
  {
code:"SECTOR-01", name:"Land of Yokai / Forest of the Nine-Tails",
sub:"Yokai Habitat · Glitch-Infested Forest",
desc:"A deep forest inhabited by nine-tailed foxes and other yokai. Glitches seep between the trees, warping the surrounding space, and even compasses cannot be relied upon to function properly. It is presumed to be close to Kuro’s original habitat.",
guardian:"Nine-Tailed Fox Pack (Multiple Unidentified Entities)", danger:"High", dc:"d-high",
px:56, py:26, pinClass:"", bg:"linear-gradient(135deg,#0d1a0d,#1a1200)"
},
{
code:"SECTOR-02", name:"Land of Angels / Sanctuary of Light",
sub:"Angel Domain · Holy Sanctuary",
desc:"A highland sanctuary inhabited by angels. Access is strictly restricted, and Shiro has been intermittently sighted in this region. Anomalies related to halo-covered glitches have been reported.",
guardian:"Shiro — Intermittent Sightings", danger:"Unknown", dc:"d-unk",
px:86, py:14, pinClass:"pin-mint", bg:"linear-gradient(135deg,#080814,#0a0d20)"
},
{
code:"SECTOR-03", name:"Demon Territory / Altar of the Abyss",
sub:"Demon Domain · Abyssal Altar",
desc:"The stronghold of pure demon-class entities. It is said that an altar exists here where pure demons like Kisne form contracts. In its depths lie engraved traces of contracts with nameless beings.",
guardian:"Principle of Contract (Phenomenon Entity)", danger:"Very High", dc:"d-high",
px:88, py:43, pinClass:"", bg:"linear-gradient(135deg,#1a0505,#0d0005)"
},
{

const BOOT = [
{t:"> Launching WORLD_MAP.exe...", w:false},
{t:"> Initializing satellite connection...", w:false},
{t:"> Loading continental terrain data...", w:false},
{t:"> Scanning sector database...", w:false},
{t:"  [SECTOR-01] Land of Yokai........OK", w:false, sub:true},
{t:"  [SECTOR-02] Land of Angels.......OK", w:false, sub:true},
{t:"  [SECTOR-03] Demon Territory......OK", w:false, sub:true},
{t:"  [SECTOR-04] Anomaly Zone..... WARNING", w:true,  sub:true},
{t:"  [SECTOR-05] City of Contracts....OK", w:false, sub:true},
{t:"  [SECTOR-EX] Isle of Time.........OK", w:false, sub:true},
{t:"> Warning: Data corruption detected in SECTOR-04", w:true},
{t:"> Bypassing corruption filter........OK", w:false},
{t:"> Rendering pin overlay.............OK", w:false},
{t:"> System ready.", w:false},
];


async function runBoot(){
  const lines = document.getElementById("boot-lines");
  const fill  = document.getElementById("bfill");
  for(let i=0;i<BOOT.length;i++){
    await sleep(70 + Math.random()*80);
    const el = document.createElement("div");
    el.className = (BOOT[i].sub ? "boot-line-sub" : "boot-line") + (BOOT[i].w ? " boot-warn" : "");
    el.style.animationDelay = "0s";
    el.textContent = BOOT[i].t;
    lines.appendChild(el);
    fill.style.width = ((i+1)/BOOT.length*100)+"%";
  }
  await sleep(400);

  // TV 꺼지는 효과로 부팅 화면 사라짐
  document.getElementById("boot-overlay").classList.add("tv-off");
  await sleep(300);

  // TV 켜지는 효과로 지도 등장
  const mw = document.getElementById("map-wrapper");
  mw.style.opacity = "1";
  mw.classList.add("tv-on");

  await sleep(700);
  document.getElementById("boot-overlay").style.display = "none";
  initMap();
}
const sleep = ms => new Promise(r=>setTimeout(r,ms));

function initMap(){
  const terrain = document.getElementById("terrain");
  LOCS.forEach(loc=>{
    const pin = document.createElement("div");
    pin.className = "map-pin";
    pin.style.left = loc.px + "%";
    pin.style.top  = loc.py + "%";
    pin.innerHTML = `
      <div class="pin-wrap">
        <div class="pin-dot-wrap ${loc.pinClass}">
          <div class="pin-outer"></div>
          <div class="pin-inner"></div>
        </div>
        <div class="pin-code">${loc.code}</div>
      </div>
    `;
    // pinClass를 pin-dot-wrap 대신 pin 자체에 적용
    pin.querySelector(".pin-dot-wrap").className = "pin-dot-wrap";
    if(loc.pinClass) pin.classList.add(loc.pinClass);
    pin.addEventListener("click", ()=>openPopup(loc));
    terrain.appendChild(pin);
  });

  terrain.addEventListener("mousemove", e=>{
    const r = terrain.getBoundingClientRect();
    const rx = ((e.clientX-r.left)/r.width*100).toFixed(1);
    const ry = ((e.clientY-r.top)/r.height*100).toFixed(1);
    document.getElementById("coord-txt").textContent = "위도: "+ry+"  경도: "+rx;
  });
}

function openPopup(loc){
  document.getElementById("p-code").textContent = loc.code;
  document.getElementById("popup-name").textContent = loc.name;
  document.getElementById("popup-sub").textContent = loc.sub;
  document.getElementById("popup-desc").textContent = loc.desc;
  document.getElementById("popup-banner-bg").style.background = loc.bg;
  document.getElementById("popup-stats").innerHTML = `
    <div class="pstat">
      <div class="pstat-ico">👁</div>
      <div>
        <div class="pstat-lbl">수호자 / 관측된 존재</div>
        <div class="pstat-val">${loc.guardian}</div>
      </div>
    </div>
    <div class="pstat">
      <div class="pstat-ico">⚠</div>
      <div>
        <div class="pstat-lbl">위험도</div>
        <div class="pstat-val ${loc.dc}">${loc.danger}</div>
      </div>
    </div>
  `;
  document.getElementById("popup").classList.add("open");
}
function closePopup(){
  document.getElementById("popup").classList.remove("open");
}
document.getElementById("popup").addEventListener("click", e=>{
  if(e.target===document.getElementById("popup")) closePopup();
});

runBoot();
</script>
