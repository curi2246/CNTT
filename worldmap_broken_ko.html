<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WORLD MAP</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
:root{--mint:#5effeb;--pink:#ff5e5e;--mono:'Share Tech Mono','Courier New',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;color:#fff;font-family:var(--mono);overflow:hidden}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:90;pointer-events:none}
#scan{position:fixed;inset:0;z-index:95;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.08) 2px 4px)}
/* 부팅 */
#boot{position:fixed;inset:0;z-index:80;background:#020d0d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#boot.off{animation:tvoff .6s cubic-bezier(.23,1,.32,1) forwards}
@keyframes tvoff{0%{clip-path:inset(0);opacity:1}40%{clip-path:inset(49% 0 49% 0);opacity:1}70%{clip-path:inset(49.8% 0 49.8% 0);opacity:1;filter:brightness(3)}100%{clip-path:inset(50% 0 50% 0);opacity:0;filter:brightness(0)}}
#bl{width:min(600px,85vw);max-height:55vh;overflow:hidden;display:flex;flex-direction:column;gap:6px;font-size:clamp(11px,1.5vw,14px);letter-spacing:1px}
#bl div{color:var(--mint);white-space:nowrap}#bl .s{padding-left:8px;opacity:.9}#bl .w{color:var(--pink)}
.bw{width:min(600px,85vw)}.bwl{font-size:10px;letter-spacing:.4em;color:rgba(94,255,235,.55);margin-bottom:6px}
.bb{height:2px;background:#0a1a1a}.bb i{display:block;height:100%;width:0;background:var(--mint);box-shadow:0 0 10px var(--mint)}
/* 지도 */
#wrap{position:fixed;inset:0;display:grid;grid-template-rows:54px 1fr auto;gap:10px;padding:0 14px 10px;opacity:0;clip-path:inset(50% 0 50% 0)}
#wrap.on{animation:tvon .7s cubic-bezier(.16,1,.3,1) forwards}
@keyframes tvon{0%{clip-path:inset(50% 0 50% 0);opacity:1;filter:brightness(3) saturate(0)}20%{clip-path:inset(49% 0 49% 0);opacity:1;filter:brightness(2) saturate(0)}50%{clip-path:inset(20% 0 20% 0);opacity:1;filter:brightness(1.3) saturate(.5)}80%{clip-path:inset(2% 0 2% 0);opacity:1;filter:brightness(1.1) saturate(.9)}100%{clip-path:inset(0);opacity:1;filter:none}}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid rgba(94,255,235,.3);background:linear-gradient(90deg,rgba(94,255,235,.07),rgba(0,0,0,.85))}
.t{font-size:clamp(.7rem,3vw,.95rem);letter-spacing:.2em;color:var(--mint);text-shadow:0 0 14px rgba(94,255,235,.4)}.t span{color:#777}
#close{font:700 11px var(--mono);letter-spacing:.2em;padding:8px 14px;color:var(--pink);background:none;border:1px solid rgba(255,94,94,.55);cursor:pointer;transition:.25s}
#close:hover{background:rgba(255,94,94,.14);box-shadow:0 0 14px rgba(255,94,94,.35)}
#stage{position:relative;overflow:hidden;border:1px solid rgba(94,255,235,.28);background:#030606;cursor:crosshair}
#stage::before,#stage::after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--mint);z-index:6;pointer-events:none}
#stage::before{top:-1px;left:-1px;border-right:0;border-bottom:0}#stage::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation}
#tip{position:absolute;pointer-events:none;z-index:5;font-size:11px;letter-spacing:.15em;padding:4px 8px;background:rgba(1,8,9,.88);border:1px solid;opacity:0;transform:translate(-50%,-150%);transition:opacity .2s;white-space:nowrap}
#foot{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 12px;font-size:10px;letter-spacing:.2em;color:#8a9}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;font:700 10px var(--mono);letter-spacing:.12em;padding:8px 11px;background:rgba(2,13,13,.7);color:var(--c);border:1px solid var(--c);cursor:pointer;transition:.25s;white-space:nowrap}
.chip:hover{background:var(--c);color:#010809;box-shadow:0 0 14px var(--c)}
/* 팝업 */
#popup{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .3s}
#popup.open{opacity:1;pointer-events:auto}
#card{position:relative;width:min(420px,92%);max-height:92%;overflow-y:auto;background:rgba(3,9,9,.95);border:1px solid var(--c,rgba(94,255,235,.4));box-shadow:0 0 40px color-mix(in srgb,var(--c) 25%,transparent);transform:translateY(16px) scale(.97);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
#popup.open #card{transform:none}
#card::before,#card::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--c);z-index:3}
#card::before{top:-1px;left:-1px;border-right:0;border-bottom:0}#card::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
#pc{position:absolute;top:8px;right:8px;z-index:4;width:28px;height:28px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.3);color:#fff;cursor:pointer;font:12px var(--mono)}
#banner{position:relative;height:96px;overflow:hidden;border-bottom:1px solid rgba(255,255,255,.12)}
#banner .bg{position:absolute;inset:0}
#banner .gr{position:absolute;inset:0;background:linear-gradient(to top,#030909,transparent 70%)}
#banner .nz{position:absolute;inset:0;opacity:.5;mix-blend-mode:screen}
#bc{position:absolute;left:16px;bottom:10px;font-size:10px;letter-spacing:.35em;color:var(--c)}
#pbody{padding:16px 18px 22px;display:flex;flex-direction:column;gap:10px}
#pn{font-size:1.05rem;line-height:1.4;letter-spacing:.06em;color:#fff}
#psub{font-size:10px;letter-spacing:.25em;color:var(--c)}
#pd{font-size:12px;line-height:1.85;color:#cde;border-left:2px solid var(--c);padding-left:12px}
.st{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.03)}
.st .ic{font-size:1rem;opacity:.8}.st .l{font-size:9px;letter-spacing:.25em;color:#8a9}.st .v{font-size:13px;margin-top:3px;color:#fff}
.st .v.d{color:var(--pink);text-shadow:0 0 10px rgba(255,94,94,.5)}
.bar{height:3px;margin-top:8px;background:rgba(255,255,255,.08)}.bar i{display:block;height:100%;width:0;background:var(--pink);box-shadow:0 0 8px var(--pink);transition:width 1s cubic-bezier(.2,.8,.2,1) .3s}
#boot.gl{animation:bGl .13s steps(2) 1}
@keyframes bGl{0%{transform:translate(-7px,2px) skewX(3deg);filter:hue-rotate(45deg) saturate(2.2)}50%{transform:translate(6px,-2px) skewX(-2deg);filter:hue-rotate(-30deg)}100%{transform:none;filter:none}}
#bl div.cr{color:var(--pink)!important;text-shadow:2px 0 rgba(255,60,60,.8),-2px 0 rgba(60,255,230,.8)}
#bl div.tr{transform:translateX(var(--tx,0))}
#bnz{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;image-rendering:pixelated}
.bef{position:absolute;font-size:12px;letter-spacing:.2em;color:var(--pink);text-shadow:2px 0 rgba(60,255,230,.7);pointer-events:none;animation:befa .46s steps(3) forwards;z-index:2}
@keyframes befa{0%{opacity:1}100%{opacity:0}}
#boot.bad .bb i{background:var(--pink)!important;box-shadow:0 0 10px var(--pink)!important}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<div id="scan"></div>
<canvas id="gl"></canvas>
<div id="boot"><canvas id="bnz"></canvas><div id="bl"></div><div class="bw"><div class="bwl" id="bwl"></div><div class="bb"><i id="bf"></i></div></div></div>
<div id="wrap">
  <header><div class="t">◆ <span id="t1" style="color:var(--mint)"></span> <span>—</span> <span id="t2" style="color:#9aa"></span></div><button id="close"></button></header>
  <div id="stage"><canvas id="cv"></canvas><div id="tip"></div>
    <div id="popup"><div id="card"><button id="pc">✕</button>
      <div id="banner"><div class="bg" id="pbg"></div><canvas class="nz" id="pnz" width="210" height="48"></canvas><div class="gr"></div><div id="bc">● <span id="pcode"></span></div></div>
      <div id="pbody"><div id="pn"></div><div id="psub"></div><div id="pd"></div><div id="pst"></div></div></div></div>
  </div>
  <div id="foot"><span id="coord"></span><div class="chips" id="chips"></div><span>WORLD_MAP.exe v1.0</span></div>
</div>
<script>
const L={"t1": "월드맵", "t2": "대륙 구역", "close": "✕ 닫기", "loading": "로딩", "lat": "위도", "lon": "경도", "extinct": "소멸", "guardLbl": "수호자 / 관측된 존재", "dangerLbl": "위험 수준", "boot": [{"t": "> WORLD_MAP.exe 초기화 중..."}, {"t": "> 위성 연결 수립 중..."}, {"t": "> 대륙 지형 데이터 로드 중..."}, {"t": "> 구역 데이터베이스 검색 중..."}, {"t": "  [SECTOR-01] 여우의 서식지..........소멸", "w": true, "sub": true}, {"t": "  [SECTOR-02] 천사의 영역............소멸", "w": true, "sub": true}, {"t": "  [SECTOR-03] 악마의 영역............소멸", "w": true, "sub": true}, {"t": "  [SECTOR-04] 이상 지대.............경고", "w": true, "sub": true}, {"t": "  [SECTOR-05] 계약의 도시............소멸", "w": true, "sub": true}, {"t": "  [SECTOR-EX] 시간의 섬..............소멸", "w": true, "sub": true}, {"t": "> 치명적: 모든 구역이 키스네 코든에 의해 파괴됨", "w": true}, {"t": "> 남은 데이터 렌더링 중...........완료"}, {"t": "> 시스템 준비 완료."}], "locs": [{"code": "SECTOR-00", "name": "황무지 — 종말", "sub": "황무지 · 아무것도 남지 않음", "desc": "대륙 전체가 키스네 코든에 의해 소멸했다. 모든 문명과 영토, 생명이 지워졌으며 재와 침묵만이 남아 있다.", "guardian": "없음", "danger": "절대적", "px": 55, "py": 50, "bg": "linear-gradient(135deg,#1a0a0a,#0a0505)"}, {"code": "SECTOR-04", "name": "이상 지대 / 글리치 구역", "sub": "글리치 지대 · 이상 구역", "desc": "글리치 현상이 가장 극단적으로 나타나는 지역. 공간 자체가 불안정하고 통상적인 물리 법칙이 적용되지 않는다. 주변에는 심하게 글리치에 감염된 존재들이 있으며, 접근 시 심각한 인지 왜곡이 보고되었다.", "guardian": "미확인 글리치 존재", "danger": "극단적", "px": 13, "py": 45, "bg": "linear-gradient(135deg,#0d000d,#050005)"}], "ghosts": [{"code": "SECTOR-01", "name": "여우의 서식지", "px": 43, "py": 30}, {"code": "SECTOR-02", "name": "천사의 영역", "px": 72, "py": 20}, {"code": "SECTOR-03", "name": "악마의 영역", "px": 80, "py": 56}, {"code": "SECTOR-05", "name": "계약의 도시", "px": 45, "py": 64}, {"code": "SECTOR-EX", "name": "시간의 섬", "px": 57, "py": 86}]};
const $=id=>document.getElementById(id),cv=$('cv'),x=cv.getContext('2d');
let W,H,D,hov=null,t0=0,terr=null,open=false;
const rnd=(a,b)=>a+Math.random()*(b-a),cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ACT=L.locs,GH=L.ghosts,COLS=['#ff5e5e','#d36bff'];
function hash(a,b){const n=Math.sin(a*127.1+b*311.7)*43758.5453;return n-Math.floor(n)}
function vn(a,b){const i=Math.floor(a),j=Math.floor(b),f=a-i,g=b-j,u=f*f*(3-2*f),v=g*g*(3-2*g),m=(p,q,t)=>p+(q-p)*t;return m(m(hash(i,j),hash(i+1,j),u),m(hash(i,j+1),hash(i+1,j+1),u),v)}
function fbm(a,b){let s=0,A=.5;for(let o=0;o<4;o++){s+=A*vn(a,b);a*=2.1;b*=2.1;A/=2}return s}
/* ───── 지형: 잿빛 대륙 조각 + 붉게 달궈진 균열 + 글리치 구역 정적 ───── */
function terrain(){
  const w=360,h=200,c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d'),im=g.createImageData(w,h),d=im.data;
  const seeds=[...Array(9)].map(()=>({x:rnd(.05,.95),y:rnd(.08,.92),ox:rnd(-6,6),oy:rnd(-4,4)}));
  const P=[...ACT,...GH];
  for(let py=0;py<h;py++)for(let px=0;px<w;px++){
    const u=px/w,v=py/h;let d1=9,d2=9,id=0;
    seeds.forEach((s,i)=>{const dx=(u-s.x)*1.8,dy=v-s.y,q=Math.hypot(dx,dy);if(q<d1){d2=d1;d1=q;id=i}else if(q<d2)d2=q});
    const gap=(d2-d1)*w/9,S=seeds[id],k=(py*w+px)*4;
    if(gap<1.2){const a=cl(1-gap/1.2);d[k]=255;d[k+1]=94+a*40;d[k+2]=70;d[k+3]=50+a*180;continue}
    let e=fbm(u*5+S.ox,v*3+S.oy)*.8;
    P.forEach(p=>{const dx=(u-p.px/100)*1.7,dy=v-p.py/100;e+=.45*Math.exp(-(dx*dx+dy*dy)/.06)});
    e*=1-Math.pow(Math.abs(u*2-1),4)*.5-Math.pow(Math.abs(v*2-1),4)*.5;
    if(e<.5){d[k]=140;d[k+1]=150;d[k+2]=160;d[k+3]=e>.47?26:0}
    else{
      const b=Math.min(4,Math.floor((e-.5)/.09)),r=(e-.5)%.09,sc=fbm(u*9+3,v*6+7);
      if(e<.512){d[k]=170;d[k+1]=172;d[k+2]=180;d[k+3]=200}
      else if(r<.007){d[k]=150;d[k+1]=150;d[k+2]=160;d[k+3]=70}
      else if(sc>.62){d[k]=18;d[k+1]=14;d[k+2]=14;d[k+3]=190;if(Math.random()<.03){d[k]=255;d[k+1]=120;d[k+2]=60;d[k+3]=230}}
      else{const bs=52+b*13;d[k]=bs;d[k+1]=bs;d[k+2]=bs+6;d[k+3]=70+b*24}
    }
    if(u<.27&&Math.random()<.07){const v2=100+Math.random()*155;d[k]=v2;d[k+1]=v2*.4;d[k+2]=v2;d[k+3]=140}
  }
  g.putImageData(im,0,0);return c;
}
/* ───── 화면 전체 유리 균열 (휴대폰 액정처럼, 로딩부터 지도까지 같은 금이 유지됨) ───── */
const GlassFX=(function(){
let W,H,D,x;
/* ───── 유리 균열 / 파편 ───── */
let segs=[],shards=[],sparks=[],cache=null,cached=false;
function genGlass(){
  segs=[];sparks=[];cache=null;cached=false;
  [[.5,.5,1],[.16,.2,.6],[.84,.24,.6],[.18,.82,.55],[.84,.8,.55],[.5,.96,.45]].forEach(([fx,fy,sz],ii)=>{
    const cx=fx*W,cy=fy*H,maxR=Math.max(W,H)*.5*sz,n=ii?6:9,tb=ii*.25;
    for(let i=0;i<n;i++){
      let a=i/n*6.283+rnd(-.2,.2),px=cx,py=cy,len=0;const Lm=maxR*rnd(.5,1),w=ii?1.1:1.6;
      while(len<Lm){const st=rnd(22,52);a+=rnd(-.22,.22);const nx2=px+Math.cos(a)*st,ny=py+Math.sin(a)*st;
        segs.push({x1:px,y1:py,x2:nx2,y2:ny,w:Math.max(.6,w*(1-len/Lm*.7)),t:tb+len/maxR*1.5});
        if(Math.random()<.07&&len>40){let bx=nx2,by=ny,ba=a+rnd(.5,1)*(Math.random()<.5?-1:1),bl=0;const BL=rnd(50,140);while(bl<BL){const s2=rnd(14,30);ba+=rnd(-.3,.3);const qx=bx+Math.cos(ba)*s2,qy=by+Math.sin(ba)*s2;segs.push({x1:bx,y1:by,x2:qx,y2:qy,w:.7,t:tb+(len+bl)/maxR*1.5});bx=qx;by=qy;bl+=s2}}
        px=nx2;py=ny;len+=st;if(Math.random()<.05)sparks.push({x:px,y:py,ph:rnd(0,6.28),v:rnd(.1,.4),s:rnd(.8,2)});
      }
    }
  });
  shards=[...Array(5)].map(()=>{const n=5+Math.floor(rnd(0,2)),r=rnd(20,56);return{bx:rnd(.05,.95)*W,by:rnd(.08,.92)*H,rot:rnd(0,6.28),vr:rnd(-.15,.15),ph:rnd(0,6.28),amp:rnd(6,14),
    pts:[...Array(n)].map((_,i)=>{const a=i/n*6.283+rnd(-.3,.3),rr=r*rnd(.55,1);return[Math.cos(a)*rr,Math.sin(a)*rr*rnd(.5,.9)]})}});
}
function seg(c,s,k,full){const ex=s.x1+(s.x2-s.x1)*k,ey=s.y1+(s.y2-s.y1)*k;c.beginPath();c.moveTo(s.x1,s.y1);c.lineTo(ex,ey);
  c.lineWidth=s.w+2;c.strokeStyle='rgba(0,0,0,.35)';c.stroke();c.lineWidth=s.w;c.strokeStyle=`rgba(255,255,255,${.2+.26*Math.min(1,s.w/1.6)})`;c.stroke();
  if(full){c.save();c.translate(-1,0);c.strokeStyle='rgba(94,255,235,.18)';c.lineWidth=.8;c.stroke();c.translate(2,0);c.strokeStyle='rgba(255,80,80,.14)';c.stroke();c.restore()}}
function drawGlass(e){
  if(e>2.6){if(!cached){cache=document.createElement('canvas');cache.width=W*D;cache.height=H*D;const c=cache.getContext('2d');c.scale(D,D);c.lineCap='round';segs.forEach(s=>seg(c,s,1,true));cached=true}x.drawImage(cache,0,0,W,H)}
  else{x.save();x.lineCap='round';segs.forEach(s=>{if(s.t<=e)seg(x,s,cl((e-s.t)/.12),false)});x.restore()}
  shards.forEach(s=>{const px=s.bx+Math.sin(e*.35+s.ph)*s.amp,py=s.by+Math.cos(e*.28+s.ph)*s.amp*.7;x.save();x.translate(px,py);x.rotate(s.rot+e*s.vr);x.globalAlpha=cl((e-.5)/1.2);
    x.beginPath();s.pts.forEach(([a,b],i)=>i?x.lineTo(a,b):x.moveTo(a,b));x.closePath();const g=x.createLinearGradient(-30,-30,30,30);g.addColorStop(0,'rgba(255,255,255,.10)');g.addColorStop(1,'rgba(150,230,255,.04)');x.fillStyle=g;x.fill();
    x.strokeStyle='rgba(255,255,255,.3)';x.lineWidth=1;x.shadowColor='rgba(94,255,235,.5)';x.shadowBlur=6;x.stroke();x.restore()});
  sparks.forEach(p=>{p.y+=p.v*.12;if(p.y>H)p.y=0;const v=.5+.5*Math.sin(e*2+p.ph);x.fillStyle=`rgba(${p.ph>3?'255,94,94':'94,255,235'},${v*.8*cl(e-1)})`;x.fillRect(p.x,p.y,p.s,p.s)});
}

function addLong(){
  for(let k=0;k<6;k++){
    const vert=k>=3,i=k%3;let px,py,a,Lm;
    if(vert){px=rnd(.15,.85)*W;const top=i%2===0;py=top?0:H;a=(top?1:-1)*Math.PI/2+rnd(-.35,.35);Lm=H*rnd(.7,1.1)}
    else{const left=i%2===0;px=left?0:W;py=rnd(.1,.9)*H;a=(left?0:Math.PI)+rnd(-.5,.5);Lm=W*rnd(.8,1.2)}
    let len=0;const t=rnd(0,.5);
    while(len<Lm){const st=rnd(26,60);a+=rnd(-.2,.2);const nx=px+Math.cos(a)*st,ny=py+Math.sin(a)*st;segs.push({x1:px,y1:py,x2:nx,y2:ny,w:Math.max(.6,1.4*(1-len/Lm*.6)),t});px=nx;py=ny;len+=st}
  }
}
return{init(c,w,h,d){x=c;W=w;H=h;D=d},gen(){genGlass();addLong()},draw:drawGlass};
})();
/* ───── 재 / 불씨 / 안개 ───── */
const ash=[...Array(110)].map(()=>({x:Math.random(),y:Math.random(),s:rnd(.6,2),v:rnd(.02,.08),d:rnd(-.02,.03),e:Math.random()<.12,ph:rnd(0,6.28)}));
const fog=[...Array(3)].map(()=>({x:Math.random(),y:rnd(.2,.8),r:rnd(.25,.45),v:rnd(.004,.012),a:rnd(.04,.07)}));
function drawAtmos(e,dt){
  fog.forEach(f=>{f.x+=f.v*dt;if(f.x>1.4)f.x=-.4;const g=x.createRadialGradient(f.x*W,f.y*H,0,f.x*W,f.y*H,f.r*W);g.addColorStop(0,`rgba(150,150,160,${f.a})`);g.addColorStop(1,'rgba(150,150,160,0)');x.fillStyle=g;x.fillRect(0,0,W,H)});
  ash.forEach(a=>{a.y+=(a.e?-a.v*.6:a.v)*dt;a.x+=a.d*dt;if(a.y>1.02)a.y=-.02;if(a.y<-.02)a.y=1.02;if(a.x<0)a.x=1;if(a.x>1)a.x=0;
    const fl=.5+.5*Math.sin(e*3+a.ph);x.fillStyle=a.e?`rgba(255,${110+fl*60|0},60,${.35+.45*fl})`:`rgba(190,190,200,${.22+.25*fl})`;x.fillRect(a.x*W,a.y*H,a.s,a.s)});
}
/* ───── 핀 ───── */
const pxy=p=>[W*p.px/100,H*p.py/100],ms=()=>Math.min(W,H)/520;
function drawGhost(p,e){
  const [px,py]=pxy(p),m=ms(),on=hov===p;
  x.save();x.translate(px,py);x.globalAlpha=on?.9:.45;x.strokeStyle='#9aa';x.lineWidth=1.4;const r=7*m;
  x.beginPath();x.moveTo(-r,-r);x.lineTo(r,r);x.moveTo(r,-r);x.lineTo(-r,r);x.stroke();
  x.setLineDash([2,4]);x.beginPath();x.arc(0,0,r*2.2,e*.3,e*.3+6.28);x.stroke();x.setLineDash([]);
  x.fillStyle='#9aa';x.font=`${Math.max(8,8*m)}px 'Share Tech Mono','Courier New',monospace`;x.textAlign='center';x.fillText(p.code,0,r*3.4);
  x.beginPath();x.moveTo(-x.measureText(p.code).width/2,r*3.4-3);x.lineTo(x.measureText(p.code).width/2,r*3.4-3);x.stroke();
  x.restore();
}
function drawZero(p,e){
  const [px,py]=pxy(p),m=ms(),on=hov===p;
  x.save();x.translate(px,py);
  for(let i=0;i<4;i++){const q=(e*.25+i/4)%1,r=(14+q*110)*m;x.strokeStyle=`rgba(255,94,94,${(1-q)*.55})`;x.lineWidth=1.6*(1-q)+.4;x.beginPath();x.arc(0,0,r,0,6.283);x.stroke()}
  const g=x.createRadialGradient(0,0,0,0,0,40*m);g.addColorStop(0,'rgba(0,0,0,.9)');g.addColorStop(.5,'rgba(60,10,10,.45)');g.addColorStop(1,'rgba(255,94,94,0)');x.fillStyle=g;x.beginPath();x.arc(0,0,40*m,0,6.283);x.fill();
  for(let i=0;i<10;i++){const a=i/10*6.283+Math.sin(i*7)*.2,l=(24+Math.sin(i*3.1)*10)*m;x.strokeStyle='rgba(255,94,94,.45)';x.lineWidth=1;x.beginPath();x.moveTo(Math.cos(a)*14*m,Math.sin(a)*14*m);x.lineTo(Math.cos(a)*l*1.6,Math.sin(a)*l*1.6);x.stroke()}
  const f=.5+.5*Math.sin(e*4);x.fillStyle=`rgba(255,${80+f*60|0},60,${.7+.3*f})`;x.shadowColor='#ff5e5e';x.shadowBlur=14+on*8;x.beginPath();x.arc(0,0,(4+on*1.5)*m,0,6.283);x.fill();x.shadowBlur=0;
  x.restore();label(p,'#ff5e5e',px,py+30*m,on);
}
function drawGlitch(p,e){
  const [px,py]=pxy(p),m=ms(),on=hov===p,gl=Math.random()<.12;
  x.save();x.translate(px,py);
  const r=22*m;
  for(const [ox,col] of gl?[[-4,'rgba(94,255,235,.8)'],[4,'rgba(255,60,200,.8)']]:[[0,'rgba(211,107,255,.85)']]){x.strokeStyle=col;x.lineWidth=1.8;x.shadowColor='#d36bff';x.shadowBlur=gl?0:12;
    for(let i=0;i<6;i++){const a0=i/6*6.283-e*.4,a1=a0+.7;x.beginPath();x.arc(ox,0,r*(1+(i%2)*.2),a0,a1);x.stroke()}}
  x.shadowBlur=0;
  for(let i=0;i<7;i++)if(Math.random()<.7){x.fillStyle=`rgba(${Math.random()<.5?'94,255,235':'255,60,200'},.${3+i%4})`;x.fillRect(rnd(-r*1.8,r*1.8),rnd(-r*1.5,r*1.5),rnd(4,26)*m,rnd(1,3))}
  x.fillStyle=`rgba(211,107,255,${.6+.4*Math.random()})`;x.shadowColor='#d36bff';x.shadowBlur=12;x.beginPath();x.arc(0,0,(4+on*1.5)*m,0,6.283);x.fill();
  x.restore();label(p,'#d36bff',px,py+30*m,on,Math.random()<.04);
}
function label(p,c,px,py,on,skip){if(skip)return;x.fillStyle=c;x.globalAlpha=on?1:.75;x.font=`${on?11:9}px 'Share Tech Mono','Courier New',monospace`;x.textAlign='center';x.fillText(p.code,px,py);x.globalAlpha=1}

/* ───── 루프 ───── */
let nextG=0,glEnd=0,bars=[],last=0;
function frame(ts){
  if(!t0)t0=ts;const e=(ts-t0)/1000,dt=Math.min((ts-last)/1000,.05)||.016;last=ts;
  x.clearRect(0,0,W,H);
  const g=x.createRadialGradient(W/2,H/2,0,W/2,H/2,W*.7);g.addColorStop(0,'#0b0f10');g.addColorStop(1,'#030606');x.fillStyle=g;x.fillRect(0,0,W,H);
  if(terr){x.save();x.globalAlpha=cl(e/1.2);x.drawImage(terr,0,0,W,H);x.restore()}
  drawAtmos(e,dt);
  GH.forEach(p=>drawGhost(p,e));
  drawZero(ACT[0],e);drawGlitch(ACT[1],e);
  
  x.fillStyle='rgba(0,0,0,.06)';for(let i=0;i<H;i+=3)x.fillRect(0,i,W,1);
  const now=performance.now();if(!nextG)nextG=now+2000;
  if(now>nextG){nextG=now+rnd(1500,4200);glEnd=now+rnd(90,170);bars=[...Array(Math.floor(rnd(3,7)))].map(()=>({y:rnd(0,H),h:rnd(2,12),x:rnd(0,W*.6),w:rnd(.2,1)*W,c:Math.random()<.5?'255,60,60':'60,255,230'}))}
  if(now<glEnd)bars.forEach(b=>{x.fillStyle=`rgba(${b.c},.13)`;x.fillRect(b.x,b.y,b.w,b.h)});
  requestAnimationFrame(frame);
}
/* ───── 입력 ───── */
function pick(mx,my){let f=null;[...ACT,...GH].forEach(p=>{const [px,py]=pxy(p);if(Math.hypot(mx-px,my-py)<Math.max(26,Math.min(W,H)*.06))f=p});return f}
cv.addEventListener('pointermove',ev=>{const r=cv.getBoundingClientRect(),mx=ev.clientX-r.left,my=ev.clientY-r.top;
  $('coord').textContent=`${L.lat}: ${(my/H*100).toFixed(1)}  ${L.lon}: ${(mx/W*100).toFixed(1)}`;
  const f=pick(mx,my);if(f!==hov){hov=f;cv.style.cursor=f?'pointer':'crosshair';const t=$('tip');if(f){const [px,py]=pxy(f);t.textContent=f.guardian?f.name:f.code+' · '+L.extinct;t.style.left=px+'px';t.style.top=py+'px';t.style.color=t.style.borderColor=f.guardian?(ACT.indexOf(f)?COLS[1]:COLS[0]):'#9aa';t.style.opacity=1}else t.style.opacity=0}});
cv.addEventListener('click',ev=>{const r=cv.getBoundingClientRect(),f=pick(ev.clientX-r.left,ev.clientY-r.top);if(f&&f.guardian)openPopup(f)});
function openPopup(p){
  const c=COLS[ACT.indexOf(p)];$('card').style.setProperty('--c',c);
  $('pcode').textContent=p.code;$('pn').textContent=p.name;$('psub').textContent=p.sub;$('pd').textContent=p.desc;$('pbg').style.background=p.bg;
  $('pst').innerHTML=`<div class="st"><div class="ic">👁</div><div><div class="l">${L.guardLbl}</div><div class="v">${p.guardian}</div></div></div><div class="st"><div class="ic">⚠</div><div style="flex:1"><div class="l">${L.dangerLbl}</div><div class="v d">${p.danger}</div><div class="bar"><i id="dbar"></i></div></div></div>`;
  $('popup').classList.add('open');setTimeout(()=>{const b=$('dbar');if(b)b.style.width='100%'},30);
  const n=$('pnz').getContext('2d'),im=n.createImageData(210,48);for(let i=0;i<im.data.length;i+=4){const v=Math.random()<.12?Math.random()*255:0;im.data[i]=v;im.data[i+1]=v*(ACT.indexOf(p)?.4:.5);im.data[i+2]=v;im.data[i+3]=v?160:0}n.putImageData(im,0,0);
}
function closePopup(){$('popup').classList.remove('open')}
$('pc').onclick=closePopup;$('popup').addEventListener('click',e=>{if(e.target===$('popup'))closePopup()});
$('close').onclick=()=>{try{if(window.parent&&window.parent!==window){if(typeof window.parent.closeWorldMapOverlay==='function'){window.parent.closeWorldMapOverlay();return}const o=window.parent.document.getElementById('map-fullscreen-overlay');if(o){o.remove();return}window.parent.postMessage('closeMap','*');return}}catch(e){}history.back()};
function size(){D=devicePixelRatio||1;const r=$('stage').getBoundingClientRect();W=r.width;H=r.height;cv.width=W*D;cv.height=H*D;x.setTransform(D,0,0,D,0,0);terr=terrain()}
addEventListener('resize',()=>{if(open)size()});
/* ───── 부팅 → TV 꺼짐(0.6s) → TV 켜짐(0.7s) : 타이밍은 원본과 동일 ───── */
const ERRS=document.documentElement.lang==='ko'?['신호 손실','메모리 오류 0x{h}','체크섬 불일치','세그먼트 오류','데이터 손상 0x{h}']:['SIGNAL LOST','ERR_MEM_FAULT 0x{h}','CHECKSUM FAIL','SEGFAULT','DATA CORRUPT 0x{h}'];
const GL='!<>-_/[]{}=+*#%$@';
function corrupt(t){const a=t.split('');for(let n=0;n<2+Math.floor(Math.random()*3);n++){const j=Math.floor(Math.random()*a.length);if(a[j]!==' ')a[j]=GL[Math.floor(Math.random()*GL.length)]}return a.join('')}
function bnoise(){const c=$('bnz'),g=c.getContext('2d');c.width=innerWidth/2|0;c.height=innerHeight/2|0;const w=c.width,h=c.height;
  for(let i=0;i<4+Math.floor(Math.random()*5);i++){g.fillStyle=Math.random()<.5?'rgba(255,60,60,.28)':'rgba(60,255,230,.25)';g.fillRect(Math.random()*w*.5,Math.random()*h,Math.random()*w,2+Math.random()*10)}
  for(let i=0;i<70;i++){const v=Math.random()*255|0;g.fillStyle=`rgba(${v},${v},${v},.35)`;g.fillRect(Math.random()*w,Math.random()*h,2+Math.random()*10,1+Math.random()*2)}
  setTimeout(()=>g.clearRect(0,0,w,h),110)}
function berr(){const e=document.createElement('div');e.className='bef';e.textContent=ERRS[Math.floor(Math.random()*ERRS.length)].replace('{h}',Math.floor(Math.random()*65535).toString(16).toUpperCase().padStart(4,'0'));e.style.left=(5+Math.random()*60)+'%';e.style.top=(10+Math.random()*75)+'%';$('boot').appendChild(e);setTimeout(()=>e.remove(),470)}
function bburst(big){const b=$('boot');b.classList.remove('gl');void b.offsetWidth;b.classList.add('gl');setTimeout(()=>b.classList.remove('gl'),140);bnoise();berr();
  if(big){berr();b.style.opacity='.12';setTimeout(()=>b.style.opacity='',70);setTimeout(()=>b.style.opacity='.3',130);setTimeout(()=>b.style.opacity='',190)}}
async function runBoot(){
  const bl=$('bl'),bf=$('bf'),wl=$('bwl'),lab=L.loading,N=L.boot.length;
  for(let i=0;i<N;i++){
    await sleep(70+Math.random()*80);
    const el=document.createElement('div'),b=L.boot[i];el.className=(b.sub?'s':'')+(b.w?' w':'');bl.appendChild(el);
    const txt=b.t;let k=0;(function sc(){el.textContent=txt.split('').map((ch,j)=>j<k||ch===' '?ch:GL[Math.floor(Math.random()*GL.length)]).join('');k+=Math.ceil(txt.length/4);if(k<txt.length+Math.ceil(txt.length/4))setTimeout(sc,18);else el.textContent=txt})();
    /* 고장 연출: 글자 깨짐 / 가로 찢김 / 진행 바 역행 / 라벨 오류 / 화면 글리치 (시간 흐름은 그대로) */
    if(b.w||Math.random()<.3)setTimeout(()=>{el.classList.add('cr');el.textContent=corrupt(txt);setTimeout(()=>{el.classList.remove('cr');el.textContent=txt},150)},170);
    if(Math.random()<.25){el.style.setProperty('--tx',(Math.random()*12-6)+'px');el.classList.add('tr');setTimeout(()=>el.classList.remove('tr'),100)}
    const target=(i+1)/N*100;bf.style.width=target+'%';
    if(i<N-1&&Math.random()<.32){setTimeout(()=>{bf.style.width=Math.max(0,target-8-Math.random()*20)+'%';$('boot').classList.add('bad')},60);setTimeout(()=>{bf.style.width=target+'%';$('boot').classList.remove('bad')},210)}
    if(Math.random()<.25){wl.textContent=document.documentElement.lang==='ko'?'오류':'ERROR';wl.style.color='var(--pink)';setTimeout(()=>{wl.textContent=lab;wl.style.color=''},150)}
    if(i===3||i===7||i===10)bburst(false);
  }
  bburst(true);
  await sleep(400);$('boot').classList.add('off');
  await sleep(300);const w=$('wrap');w.style.opacity='1';w.classList.add('on');
  size();open=true;requestAnimationFrame(frame);
  await sleep(700);$('boot').style.display='none';
}
$('t1').textContent=L.t1;$('t2').textContent=L.t2;$('close').textContent=L.close;$('bwl').textContent=L.loading;$('coord').textContent=`${L.lat}: —  ${L.lon}: —`;
$('chips').innerHTML=ACT.map((p,i)=>`<button class="chip" data-i="${i}" style="--c:${COLS[i]}">${p.code}</button>`).join('');
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>openPopup(ACT[+b.dataset.i]));
(function(){const c=$('gl'),g=c.getContext('2d');let t=0;
  function fit(){const D=devicePixelRatio||1,w=innerWidth,h=innerHeight;c.width=w*D;c.height=h*D;g.setTransform(D,0,0,D,0,0);GlassFX.init(g,w,h,D);GlassFX.gen()}
  fit();addEventListener('resize',fit);
  (function lp(ts){if(!t)t=ts;g.clearRect(0,0,innerWidth,innerHeight);GlassFX.draw((ts-t)/1000+3);requestAnimationFrame(lp)})(0);
})();
runBoot();
</script>
