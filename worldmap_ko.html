<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WORLD MAP</title>
<style>
:root{--mint:#5effeb;--pink:#ff5e5e;--blue:#1e90ff;--bg:#020d0d;--mono:'Courier New',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg)}
body{color:var(--mint);font-family:var(--mono);overflow:hidden;background:radial-gradient(ellipse 70% 50% at 50% -10%,rgba(30,144,255,.13),transparent 70%),var(--bg)}
.scan{position:fixed;inset:0;pointer-events:none;z-index:90;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.vig{position:fixed;inset:0;pointer-events:none;z-index:89;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.6))}

/* 부팅 */
#boot{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:16px;padding:0 max(20px,calc(50% - 280px));background:var(--bg);transition:opacity .6s}
#boot.off{opacity:0;pointer-events:none}
#log{font:12px/1.75 var(--mono);color:#bfe;white-space:pre-wrap;max-width:100%}
#log .w{color:var(--pink)}#log .o{color:var(--mint)}
#bbar{width:min(560px,100%);height:2px;background:rgba(94,255,235,.14)}
#bbar b{display:block;height:100%;width:0;background:var(--mint);box-shadow:0 0 10px var(--mint);transition:width .15s linear}

/* 앱 */
#app{position:fixed;inset:0;display:grid;grid-template-rows:56px 1fr 54px;padding:0 14px 0;gap:10px;clip-path:inset(50% 0 50% 0);opacity:0}
#app.on{clip-path:inset(0);opacity:1;transition:clip-path .9s cubic-bezier(.2,.8,.2,1),opacity .9s}
#app.out{opacity:0;transition:opacity .4s}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid rgba(94,255,235,.3);background:linear-gradient(90deg,rgba(94,255,235,.06),transparent)}
h2{font-size:clamp(.72rem,3vw,1rem);letter-spacing:.22em;color:var(--mint);text-shadow:0 0 14px rgba(94,255,235,.4);transition:opacity .18s}
#close{font:700 10px var(--mono);letter-spacing:.2em;padding:8px 12px;color:var(--pink);background:none;border:1px solid rgba(255,94,94,.5);cursor:pointer;transition:.25s}
#close:hover{background:rgba(255,94,94,.12);box-shadow:0 0 12px rgba(255,94,94,.3)}
#stage{position:relative;overflow:hidden;border:1px solid rgba(94,255,235,.3);background:#010809;cursor:crosshair}
#stage::before,#stage::after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--mint);z-index:6;pointer-events:none}
#stage::before{top:-1px;left:-1px;border-right:0;border-bottom:0}#stage::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
#ter{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity 1.2s .3s}
#app.on #ter{opacity:1}
.gridl{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(94,255,235,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(94,255,235,.07) 1px,transparent 1px);background-size:10% 12.5%}
.sweep{position:absolute;top:0;bottom:0;width:90px;left:-90px;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(94,255,235,.13));border-right:1px solid rgba(94,255,235,.55);animation:sw 7s linear infinite}
@keyframes sw{to{left:100%}}
#xh i{position:absolute;pointer-events:none;background:rgba(94,255,235,.35);opacity:0;transition:opacity .2s}
#xh .h{left:0;right:0;height:1px}#xh .v{top:0;bottom:0;width:1px}
#stage:hover #xh i{opacity:1}
#coord{position:absolute;left:12px;bottom:10px;font-size:9px;letter-spacing:.25em;color:rgba(94,255,235,.6);pointer-events:none}

/* 핀 */
.pin{--c:#5effeb;position:absolute;transform:translate(-50%,-100%);background:none;border:0;cursor:pointer;color:var(--c);font:700 9px var(--mono);letter-spacing:.18em;display:flex;flex-direction:column;align-items:center;z-index:4;opacity:0;animation:pop .5s cubic-bezier(.2,1.4,.4,1) forwards;animation-delay:calc(1s + var(--i)*.12s)}
@keyframes pop{from{opacity:0;transform:translate(-50%,-100%) scale(.2)}to{opacity:1;transform:translate(-50%,-100%)}}
.pin.white{--c:#fff}.pin.gold{--c:#ffd24d}.pin.pink{--c:#ff5e5e}
.pl{padding:3px 6px;border:1px solid var(--c);background:rgba(1,8,9,.8);white-space:nowrap;transition:.25s}
.pn{width:1px;height:22px;background:var(--c);opacity:.7}
.pd{position:relative;width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}
.pd::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid var(--c);animation:ring 2.4s ease-out infinite}
@keyframes ring{from{transform:scale(.5);opacity:.9}to{transform:scale(2.6);opacity:0}}
.pin:hover .pl,.pin.sel .pl{background:var(--c);color:#010809;box-shadow:0 0 16px var(--c)}
.pin.sel .pd{transform:scale(1.5)}
.pin.warn .pl{animation:flk 2.6s steps(1) infinite}
.pin.glitch .pd{animation:pglt 2.8s steps(1) infinite}
@keyframes pglt{0%,86%,100%{transform:none}88%{transform:translate(-3px,1px);box-shadow:3px 0 #5effeb,-3px 0 #d36bff}91%{transform:translate(3px,-1px);box-shadow:-3px 0 #5effeb,3px 0 #d36bff}94%{transform:translateX(-2px);box-shadow:2px 0 #ff3cc8}}
.pin.glitch .pl{animation:plglt 2.8s steps(1) infinite}
@keyframes plglt{0%,86%,100%{transform:none;text-shadow:none}88%{transform:translateX(-4px);text-shadow:2px 0 #5effeb,-2px 0 #d36bff}92%{transform:translateX(4px);text-shadow:-2px 0 #5effeb,2px 0 #d36bff}95%{transform:none;text-shadow:none}}
.pin .gfx{position:absolute;left:50%;bottom:-65px;width:140px;height:140px;margin-left:-70px;pointer-events:none;z-index:-1}
@keyframes flk{0%,90%,100%{opacity:1}92%{opacity:.2;transform:translateX(-3px)}95%{opacity:.8;transform:translateX(3px)}}

/* 정보 패널 */
#panel{position:absolute;top:0;right:0;bottom:0;width:min(340px,92%);z-index:7;background:rgba(2,13,13,.9);backdrop-filter:blur(6px);border-left:1px solid rgba(94,255,235,.4);transform:translateX(102%);transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .18s;overflow-y:auto;cursor:default}
#panel.open{transform:none}
.px{position:absolute;top:8px;right:8px;z-index:2;width:28px;height:28px;background:rgba(0,0,0,.5);border:1px solid rgba(94,255,235,.4);color:var(--mint);cursor:pointer;font:12px var(--mono)}
.ph{height:110px;display:flex;align-items:center;justify-content:center;font-size:2.6rem;background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--c) 28%,transparent),transparent 70%),repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 2px,transparent 2px 5px);border-bottom:1px solid rgba(94,255,235,.25)}
.pb{padding:16px 18px 24px;display:flex;flex-direction:column;gap:10px}
.pc{font-size:9px;letter-spacing:.4em;color:var(--pink)}
.pb h3{font-size:1rem;line-height:1.4;letter-spacing:.06em;color:#fff}
.ps{font-size:11px;color:var(--mint);opacity:.75}
.pb p{font-size:12px;line-height:1.8;color:#cde;border-left:2px solid rgba(255,94,94,.5);padding-left:12px}
.tg{display:flex;justify-content:space-between;gap:10px;font-size:10px;padding:7px 10px;border:1px solid rgba(94,255,235,.2);background:rgba(94,255,235,.03)}
.tg span{color:rgba(94,255,235,.6);letter-spacing:.15em}.tg b{color:#fff;text-align:right;font-weight:400}
.tg.dg{border-color:rgba(255,94,94,.45);background:rgba(255,94,94,.06)}.tg.dg b{color:var(--pink)}

/* 하단 칩 */
#chips{display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none;transition:opacity .18s}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:700 10px var(--mono);letter-spacing:.14em;padding:9px 12px;color:rgba(94,255,235,.75);background:rgba(2,13,13,.7);border:1px solid rgba(94,255,235,.3);cursor:pointer;transition:.25s;white-space:nowrap}
.chip:hover,.chip.sel{color:#010809;background:var(--mint);box-shadow:0 0 14px rgba(94,255,235,.4)}
.lang{position:fixed;right:18px;top:11px;z-index:95;display:none}
@media(max-width:700px){#panel{top:auto;width:100%;height:56%;border-left:0;border-top:1px solid rgba(94,255,235,.4);transform:translateY(102%)}.pl{font-size:8px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="vig"></div><div class="scan"></div>
<div id="boot"><pre id="log"></pre><div id="bbar"><b></b></div></div>
<div id="app">
  <header><h2 id="ttl"></h2><div style="display:flex;gap:8px"><button id="close"></button><button id="lg" class="chip">EN</button></div></header>
  <div id="stage">
    <canvas id="ter" width="400" height="225"></canvas><div class="gridl"></div><div class="sweep"></div>
    <div id="xh"><i class="h"></i><i class="v"></i></div><div id="coord"></div>
    <div id="pins"></div><aside id="panel"></aside>
  </div>
  <nav id="chips"></nav>
</div>
<script>
const D={"ko":{"title":"◈ 세계 지도 — 대륙 구역","locations":[{"id":"yokai_forest","name":"요괴의 땅 — 구미의 숲","sub":"고대 여우 요괴들의 영역","code":"구역-01","color":"mint","x":43,"y":32,"emoji":"🌲","desc":"기록된 역사 이전부터 요괴들이 살아온 울창한 고대의 숲. 구미호가 이 곳의 지배권을 쥐고 있다. 공간 왜곡과 환영이 빈번하게 발생하며 — 외부인이 돌아온 사례는 드물다.","tags":[{"label":"진영","value":"중립 / 요괴"},{"label":"위험 등급","value":"극도로 위험","danger":true},{"label":"관련 인물","value":"큐로 (출신지)"}]},{"id":"angel_land","name":"천사의 땅 — 빛의 성역","sub":"천상의 질서를 수호하는 성지","code":"구역-02","color":"white","x":72,"y":20,"emoji":"✨","desc":"영원한 빛으로 뒤덮인 고지대 영역. 천사들은 이곳에서 세계의 시스템을 유지한다. 무단 접근은 금지되어 있으며 — 위반자는 기록에서 말소된다.","tags":[{"label":"진영","value":"천상 / 질서"},{"label":"위험 등급","value":"접근 제한","danger":true},{"label":"관련 인물","value":"시로 (불규칙 존재)"}]},{"id":"contract_city","name":"계약의 도시","sub":"모든 종족이 공존하는 중립 지대","code":"구역-03","color":"gold","x":50,"y":55,"emoji":"🏙️","desc":"문명의 중심 거점. 원래 중립지대로 창설되었으나 현재는 가장 큰 정착지로 성장했다. 악마, 천사, 요괴, 인간 사이의 모든 계약이 보이지 않는 권력에 의해 이곳에서 집행된다.","tags":[{"label":"진영","value":"중립 / 전 종족"},{"label":"위험 등급","value":"보통"},{"label":"인구","value":"약 13억 (인간 밀집)"}]},{"id":"demon_abyss","name":"악마의 영역 — 심연의 제단","sub":"순수 악마들의 심층 영역","code":"구역-04","color":"pink","x":78,"y":52,"emoji":"🌋","desc":"순수 악마가 절대적 권위를 지닌 화산 황무지. 최고 등급의 계약 의식이 이 제단에서 거행된다. 키스네가 이 지역 출신이지만 — 그녀는 거의 인정하지 않는다.","tags":[{"label":"진영","value":"악마 / 심연"},{"label":"위험 등급","value":"치명적","danger":true},{"label":"관련 인물","value":"키스네 (전 거주자)"}]},{"id":"glitch_zone","name":"변칙과 왜곡의 규역 — 릴지 구역","sub":"현실이 영구적으로 붕괴된 곳","code":"구역-??","color":"pink","x":20,"y":58,"emoji":"⚡","desc":"누적된 글리치 현상이 물리 법칙을 영구적으로 왜곡시킨 지역. 시간, 공간, 정체성이 이곳에서 붕괴된다. 지도 자체도 이 구역을 올바르게 렌더링하기를 거부한다. 접근 금지.","tags":[{"label":"진영","value":"오류 / 미정의"},{"label":"위험 등급","value":"분류 불가","danger":true},{"label":"상태","value":"데이터 손상"}]},{"id":"isolated_isle","name":"고립된 시간의 섬 — 영원의 구원","sub":"동결된 시간의 파편","code":"구역-EX","color":"mint","x":55,"y":85,"emoji":"🏝️","desc":"대륙 본토와 시간의 흐름으로부터 분리된 작은 섬. 이곳에는 리셋이 적용되지 않는다. 그 존재는 '세이브 포인트'로 이론화되고 있지만 — 누가, 무슨 목적으로 만들었는지는 미지수다.","tags":[{"label":"진영","value":"불명 / 변칙"},{"label":"위험 등급","value":"낮음"},{"label":"특수","value":"리셋 면역 구역"}]}]},"en":{"title":"◈ WORLD MAP — CONTINENTAL SECTOR","locations":[{"id":"yokai_forest","name":"Land of Yokai — Spider's Forest","sub":"Domain of ancient fox spirits","code":"SECTOR-01","color":"mint","x":43,"y":32,"emoji":"🌲","desc":"A dense, ancient forest where yokai have lived since before recorded history. The Nine-Tail foxes hold dominion here. Spatial distortions and illusions are common — outsiders rarely return.","tags":[{"label":"ALIGNMENT","value":"Neutral / Yokai"},{"label":"DANGER LEVEL","value":"EXTREME","danger":true},{"label":"KNOWN ENTITY","value":"Curo (Origin Point)"}]},{"id":"angel_land","name":"Land of Angels — Sanctuary of Light","sub":"Sacred ground of the celestial order","code":"SECTOR-02","color":"white","x":72,"y":20,"emoji":"✨","desc":"A highland domain shrouded in perpetual radiance. Angels maintain the fabric of the world's system from here. Unauthorized access is forbidden — violators are erased from record.","tags":[{"label":"ALIGNMENT","value":"Celestial / Order"},{"label":"DANGER LEVEL","value":"RESTRICTED","danger":true},{"label":"KNOWN ENTITY","value":"Shiro (Irregular)"}]},{"id":"contract_city","name":"City of Contracts","sub":"Neutral ground — all races coexist","code":"SECTOR-03","color":"gold","x":50,"y":55,"emoji":"🏙️","desc":"The central hub of civilization. Originally founded as a neutral zone, it has evolved into the largest known settlement. Contracts between all species — demons, angels, yokai, and humans — are enforced here by an invisible authority.","tags":[{"label":"ALIGNMENT","value":"Neutral / All Races"},{"label":"DANGER LEVEL","value":"MODERATE"},{"label":"POPULATION","value":"~1.3 Billion (Human Concentration)"}]},{"id":"demon_abyss","name":"Demon Territory — Altar of the Abyss","sub":"The deep domain of pure demons","code":"SECTOR-04","color":"pink","x":78,"y":52,"emoji":"🌋","desc":"A volcanic wasteland where pure demons hold absolute authority. Contract ceremonies of the highest order are conducted at the Altar. Kisune originated from this region — though she rarely acknowledges it.","tags":[{"label":"ALIGNMENT","value":"Demon / Infernal"},{"label":"DANGER LEVEL","value":"LETHAL","danger":true},{"label":"KNOWN ENTITY","value":"Kisune (Former Resident)"}]},{"id":"glitch_zone","name":"Glitch Zone — Distortion Relict","sub":"Where reality fractures permanently","code":"SECTOR-??","color":"pink","x":20,"y":58,"emoji":"⚡","desc":"A region where accumulated glitch phenomena have permanently warped the laws of physics. Time, space, and identity collapse here. Even the map itself refuses to render this area correctly. Do not approach.","tags":[{"label":"ALIGNMENT","value":"ERROR / UNDEFINED"},{"label":"DANGER LEVEL","value":"UNCLASSIFIABLE","danger":true},{"label":"STATUS","value":"DATA CORRUPTED"}]},{"id":"isolated_isle","name":"Isle of Isolated Time — Eternal Salvation","sub":"A fragment of frozen time","code":"SECTOR-EX","color":"mint","x":55,"y":85,"emoji":"🏝️","desc":"A small island detached from the main continent and from the flow of time itself. Resets do not affect this location. Its existence is theorized to be a 'save point' — but by whom, and for what purpose, remains unknown.","tags":[{"label":"ALIGNMENT","value":"Unknown / Anomaly"},{"label":"DANGER LEVEL","value":"LOW"},{"label":"SPECIAL","value":"Reset-Immune Zone"}]}]}};
const TT={
 ko:{l:["> WORLD_MAP.exe 실행 중...","> 위성 연결 초기화...","> 대륙 지형 데이터 로드 중...","> 구역 데이터베이스 검색 중..."],f:["> 지도 렌더러 활성화...","> LAUNCH"],x:"✕ 닫기"},
 en:{l:["> Executing WORLD_MAP.exe...","> Initializing satellite link...","> Loading continental terrain data...","> Scanning sector database..."],f:["> Activating map renderer...","> LAUNCH"],x:"✕ CLOSE"}
};
let lang="ko",cur=-1;
const $=id=>document.getElementById(id),L=()=>D[lang].locations,sh=n=>n.split(" — ")[0];
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* 지형 생성 — 구역 위치를 중심으로 대륙이 솟도록 */
function terrain(){
  const c=$("ter"),x=c.getContext("2d"),W=c.width,H=c.height,im=x.createImageData(W,H),P=D.en.locations;
  const h=(a,b)=>{const n=Math.sin(a*127.1+b*311.7+7.3)*43758.5453;return n-Math.floor(n)};
  const vn=(a,b)=>{const i=Math.floor(a),j=Math.floor(b),f=a-i,g=b-j,u=f*f*(3-2*f),v=g*g*(3-2*g),m=(p,q,t)=>p+(q-p)*t;return m(m(h(i,j),h(i+1,j),u),m(h(i,j+1),h(i+1,j+1),u),v)};
  const fbm=(a,b)=>{let s=0,A=.5;for(let o=0;o<4;o++){s+=A*vn(a,b);a*=2.1;b*=2.1;A/=2}return s};
  for(let py=0;py<H;py++)for(let px=0;px<W;px++){
    const u=px/W,v=py/H;let e=fbm(u*5,v*3)*.8;
    P.forEach(p=>{const dx=(u-p.x/100)*1.7,dy=v-p.y/100,w=p.id==="isolated_isle"?.012:.045;e+=.55*Math.exp(-(dx*dx+dy*dy)/w)});
    e*=1-Math.pow(Math.abs(u*2-1),4)*.5-Math.pow(Math.abs(v*2-1),4)*.5;
    const k=(py*W+px)*4,d=im.data;
    if(e<.5){d[k]=94;d[k+1]=255;d[k+2]=235;d[k+3]=e>.47?34:(py%6===0?5:0)}
    else{const b=Math.min(4,Math.floor((e-.5)/.09)),r=(e-.5)%.09;
      if(e<.512){d[k]=94;d[k+1]=255;d[k+2]=235;d[k+3]=230}
      else if(r<.007){d[k]=94;d[k+1]=255;d[k+2]=235;d[k+3]=80}
      else{d[k]=20;d[k+1]=110+b*12;d[k+2]=130+b*10;d[k+3]=46+b*24}}
  }
  x.putImageData(im,0,0);
}

/* 부팅 */
async function boot(){
  const t=TT[lang],log=$("log"),bar=$("bbar").firstElementChild;log.innerHTML="";bar.style.width="0";
  const rows=[...t.l.map(s=>[s]),...L().map(o=>{const w=o.code.includes("?"),n="  ["+o.code+"] "+sh(o.name);return[n+" "+".".repeat(Math.max(3,40-n.length)),w?'<span class="w">WARNING</span>':'<span class="o">OK</span>']}),...t.f.map(s=>[s])];
  for(let i=0;i<rows.length;i++){log.innerHTML+=rows[i].join("")+"\n";bar.style.width=((i+1)/rows.length*100)+"%";await wait(i<4?170:110)}
  await wait(450);$("boot").classList.add("off");$("app").classList.remove("out");$("app").classList.add("on");
}

/* 렌더 */
function render(){
  const t=TT[lang];$("ttl").textContent=D[lang].title;$("close").textContent=t.x;$("lg").textContent=lang==="ko"?"EN":"KO";
  $("chips").innerHTML=L().map((o,i)=>`<button class="chip${i===cur?" sel":""}" data-i="${i}">${o.code} · ${sh(o.name)}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>sel(+b.dataset.i));
  panel();
}
/* 글리치 구역 핀: 링이 갈라지며 깜빡이고, 주변에 보라색 입자가 떠다님 */
let gfxOn=false;
function glitchFX(){
  if(gfxOn)return;gfxOn=true;
  const P=[...Array(26)].map(()=>({a:Math.random()*6.283,r:18+Math.random()*44,v:(Math.random()<.5?-1:1)*(.3+Math.random()*.7),s:1+Math.random()*2,ph:Math.random()*6.28}));
  (function f(t){
    document.querySelectorAll(".pin .gfx").forEach(c=>{
      const g=c.getContext("2d");g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,140,140);const cx=70,cy=70,gl=Math.random()<.12;
      for(const [ox,col] of gl?[[-3,"rgba(94,255,235,.8)"],[3,"rgba(255,60,200,.8)"]]:[[0,"rgba(211,107,255,.85)"]]){g.strokeStyle=col;g.lineWidth=1.6;for(let i=0;i<6;i++){const a0=i/6*6.283-t/2500,a1=a0+.7;g.beginPath();g.arc(cx+ox,cy,16*(1+(i%2)*.2),a0,a1);g.stroke()}}
      P.forEach(p=>{const a=p.a+t/1000*p.v,rr=p.r+Math.sin(t/700+p.ph)*5,al=.25+.6*Math.max(0,Math.sin(t/500+p.ph));g.fillStyle="rgba(211,107,255,"+al+")";g.fillRect(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr*.8,p.s,p.s)});
      for(let i=0;i<3;i++)if(Math.random()<.4){g.fillStyle="rgba("+(Math.random()<.5?"94,255,235":"255,60,200")+",.5)";g.fillRect(cx+(Math.random()-.5)*50,cy+(Math.random()-.5)*40,4+Math.random()*16,1+Math.random()*2)}
    });
    requestAnimationFrame(f);
  })(0);
}
function pins(){
  $("pins").innerHTML=L().map((o,i)=>`<button class="pin ${o.color}${o.code.includes("?")?" warn glitch":""}" style="left:${o.x}%;top:${o.y}%;--i:${i}" data-i="${i}"><span class="pl">${o.code}</span><span class="pn"></span><span class="pd"></span>${o.code.includes("?")?'<canvas class="gfx" width="280" height="280"></canvas>':""}</button>`).join("");
  $("pins").querySelectorAll(".pin").forEach(b=>b.onclick=e=>{e.stopPropagation();sel(+b.dataset.i)});
  glitchFX();
}
function panel(){
  const p=$("panel");if(cur<0){p.classList.remove("open");return}
  const o=L()[cur],c={mint:"#5effeb",white:"#fff",gold:"#ffd24d",pink:"#ff5e5e"}[o.color];
  p.innerHTML=`<button class="px" id="px">✕</button><div class="ph" style="--c:${c}">${o.emoji||"🌍"}</div><div class="pb"><div class="pc">CODE: ${o.code}</div><h3>${o.name}</h3><div class="ps">${o.sub||""}</div><p>${o.desc}</p>${(o.tags||[]).map(g=>`<div class="tg${g.danger?" dg":""}"><span>${g.label}</span><b>${g.value}</b></div>`).join("")}</div>`;
  $("px").onclick=()=>sel(-1);p.scrollTop=0;p.classList.add("open");
}
function sel(i){
  cur=i===cur?-1:i;
  document.querySelectorAll(".pin,.chip").forEach(e=>e.classList.toggle("sel",+e.dataset.i===cur));
  panel();
}
function setLang(){
  lang=lang==="ko"?"en":"ko";const els=[$("ttl"),$("chips"),$("panel")];
  els.forEach(e=>e.style.opacity=0);
  setTimeout(()=>{render();els.forEach(e=>e.style.opacity=1)},190);
}
$("lg").onclick=setLang;
$("close").onclick=()=>{
  cur=-1;$("panel").classList.remove("open");$("app").classList.add("out");
  setTimeout(()=>{
    if(window.parent&&window.parent!==window){
      /* 메인 사이트(iframe) 안에서 열린 경우: 지도를 닫고 메인 화면으로 */
      try{if(typeof window.parent.closeWorldMapOverlay==="function"){window.parent.closeWorldMapOverlay();return}}catch(e){}
      window.parent.postMessage("closeMap","*");
    }else{
      $("app").classList.remove("on");$("boot").classList.remove("off");boot();
    }
  },450);
};
$("stage").addEventListener("pointermove",e=>{
  const r=$("stage").getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  $("xh").children[0].style.top=y+"px";$("xh").children[1].style.left=x+"px";
  $("coord").textContent=`X ${(x/r.width*100).toFixed(1)} · Y ${(y/r.height*100).toFixed(1)}`;
});
terrain();render();pins();boot();
</script>
</body>
