<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>시간의 중간 지점</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;background:#000;color:#fff;font-family:'Share Tech Mono',monospace;overflow:hidden;}

#map-header{
position:absolute;
top:0;left:0;right:0;
height:60px;
background:rgba(0,0,0,0.8);
border-bottom:1px solid #5effeb;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
z-index:100;
}
.hdr-left{
font-size:16px;
letter-spacing:2px;
color:#5effeb;
}
.close-btn{
padding:8px 18px;
background:transparent;
border:1px solid #ff5e5e;
color:#ff5e5e;
font-size:13px;
letter-spacing:2px;
cursor:pointer;
transition:all 0.3s;
}
.close-btn:hover{
background:#ff5e5e;
color:#000;
}

#map-area{
position:absolute;
top:60px;
left:0;
right:0;
bottom:50px;
}

canvas{
display:block;
width:100%;
height:100%;
}

#info-bar{
position:absolute;
bottom:0;left:0;right:0;
height:50px;
background:rgba(0,0,0,0.85);
border-top:1px solid #5effeb;
display:flex;
align-items:center;
padding:0 20px;
z-index:100;
}
.info-txt{
color:#5effeb;
font-size:13px;
letter-spacing:1px;
}

#location-panel{
position:fixed;
right:-400px;
top:60px;
bottom:50px;
width:380px;
background:rgba(2,13,13,0.98);
border-left:2px solid #5effeb;
transition:right 0.4s ease;
z-index:200;
overflow-y:auto;
}
#location-panel.active{
right:0;
}
#panel-header{
padding:20px;
border-bottom:1px solid #5effeb;
}
#panel-title{
font-size:22px;
color:#5effeb;
letter-spacing:2px;
margin-bottom:10px;
}
#panel-subtitle{
font-size:13px;
color:#888;
letter-spacing:1px;
}
#panel-content{
padding:25px 20px;
line-height:1.8;
color:#ccc;
white-space:pre-wrap;
}
#panel-close{
position:absolute;
top:15px;
right:15px;
width:30px;
height:30px;
background:transparent;
border:1px solid #5effeb;
color:#5effeb;
font-size:18px;
cursor:pointer;
transition:all 0.3s;
display:flex;
align-items:center;
justify-content:center;
}
#panel-close:hover{
background:#5effeb;
color:#000;
}

#glass-overlay{
position:fixed;
inset:0;
pointer-events:none;
z-index:9999;
display:none;
}
#glass-overlay.active{
display:block;
}
</style>
</head>
<body>
<div id="map-header">
<div class="hdr-left">◆ 시간의 중간 지점 <span style="color:#888;">—</span> 손상된 타임라인</div>
<div class="close-btn" onclick="window.parent.postMessage('close-map','*')">✕ 닫기</div>
</div>

<div id="map-area">
<canvas id="mapCanvas"></canvas>
</div>

<div id="info-bar">
<span class="info-txt" id="status-txt">시스템 상태: 불안정 | 감지된 변칙 개체: 3</span>
</div>

<div id="location-panel">
<div id="panel-header">
<div id="panel-title"></div>
<div id="panel-subtitle"></div>
<button id="panel-close">✕</button>
</div>
<div id="panel-content"></div>
</div>

<div id="glass-overlay">
<canvas id="glass-canvas"></canvas>
</div>

<script>
var canvas = document.getElementById('mapCanvas');
var ctx = canvas.getContext('2d');
var hoveredLocation = null;
var portalPhase = 0;
var glitchOffset = 0;

var locations = {
portal: {
x: 75,
y: 45,
title: "차원 포탈",
subtitle: "DIMENSIONAL GATEWAY",
content: "시간의 틈새를 가로지르는 차원문. 이곳을 통해 손상되지 않은 과거의 세계로 돌아갈 수 있다.\n\n[상태]\n• 안정적 작동 중\n• 에너지 준위: 92%\n• 시공간 왜곡율: 0.003%\n\n[경고]\n포탈 통과 시 시간 왜곡이 발생할 수 있음. 반복 사용 시 기억 손실 가능성 존재.",
color: '#5effeb',
type: 'portal'
},
survivors: {
x: 25,
y: 40,
title: "시간 생존자들의 마을",
subtitle: "SURVIVOR'S SETTLEMENT",
content: "타임라인 붕괴에서 살아남은 자들의 정착지. 리셋과 글리치를 견뎌낸 극소수의 생존자들이 모여 작은 공동체를 이루고 있다.\n\n[인구]\n• 약 200명\n• 노에인(Noein): 47%\n• 변칙 개체: 38%\n• 일반 인간: 15%\n\n[상태]\n• 방어 시설 구축 중\n• 식량 자급률: 65%\n• 의료 시설: 기초적 수준\n\n[특징]\n대부분의 주민이 리셋 기억 보유자. 타임라인 붕괴 이전의 기술과 지식을 일부 보존하고 있음.",
color: '#c9a84c',
type: 'village'
},
final: {
x: 50,
y: 65,
title: "결전의 공간",
subtitle: "FINAL BATTLEGROUND",
content: "모든 것이 끝난 곳. 키스네 코든과의 최후의 전투가 벌어졌던 장소. 지금은 폐허만이 남아있다.\n\n[상태]\n• 접근 위험도: EXTREME\n• 방사선 수치: 정상\n• 글리치 농도: 위험 수준\n\n[잔류 에너지]\n고농도 글리치 감지됨. 현실 왜곡 현상 다수 관측.\n\n[경고]\n이 지역에 장시간 머물 경우 정신 오염 가능성. 환각, 기억 왜곡, 시간 감각 상실 등의 증상 보고됨. 방호복 착용 필수.",
color: '#ff5e5e',
type: 'danger'
}
};

function resizeCanvas() {
canvas.width = canvas.offsetWidth;
canvas.height = canvas.offsetHeight;
draw();
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function draw() {
var w = canvas.width;
var h = canvas.height;
ctx.clearRect(0, 0, w, h);

// 배경 그라디언트
var bgGrad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w*0.7);
bgGrad.addColorStop(0, '#0a1a1a');
bgGrad.addColorStop(1, '#020d0d');
ctx.fillStyle = bgGrad;
ctx.fillRect(0, 0, w, h);

// 노이즈 효과
var imageData = ctx.getImageData(0, 0, w, h);
var data = imageData.data;
for(var i = 0; i < data.length; i += 4) {
if(Math.random() > 0.97) {
var brightness = Math.random() * 60;
data[i] = brightness;     // R
data[i+1] = brightness;   // G
data[i+2] = brightness;   // B
}
}
ctx.putImageData(imageData, 0, 0);

// 글리치 라인 효과
glitchOffset += 0.05;
for(var i = 0; i < 15; i++) {
var y = (h * i / 15 + glitchOffset * 10) % h;
var glitchIntensity = Math.random();
if(glitchIntensity > 0.85) {
ctx.fillStyle = 'rgba(94,255,235,' + (0.1 * Math.random()) + ')';
ctx.fillRect(0, y, w, 2);
}
if(glitchIntensity > 0.9) {
ctx.fillStyle = 'rgba(255,94,94,' + (0.08 * Math.random()) + ')';
ctx.fillRect(0, y + 1, w, 1);
}
}

// 스캔라인 효과
ctx.fillStyle = 'rgba(0,0,0,0.05)';
for(var i = 0; i < h; i += 3) {
ctx.fillRect(0, i, w, 1);
}

// 포탈 일렁임
portalPhase += 0.03;
var portalRadius = w*0.08 + Math.sin(portalPhase) * w*0.01;

// 포탈 그리기
var px = w * 0.75;
var py = h * 0.45;

ctx.save();
// 외곽 빛
var portalGrad = ctx.createRadialGradient(px, py, 0, px, py, portalRadius);
portalGrad.addColorStop(0, 'rgba(94,255,235,0.8)');
portalGrad.addColorStop(0.5, 'rgba(58,155,216,0.5)');
portalGrad.addColorStop(1, 'rgba(2,13,13,0)');
ctx.fillStyle = portalGrad;
ctx.beginPath();
ctx.ellipse(px, py, portalRadius*0.6, portalRadius, 0, 0, Math.PI*2);
ctx.fill();

// 테두리
ctx.strokeStyle = 'rgba(94,255,235,0.9)';
ctx.lineWidth = 2.5;
ctx.beginPath();
ctx.ellipse(px, py, portalRadius*0.5, portalRadius*0.85, 0, 0, Math.PI*2);
ctx.stroke();

// 내부 파장
for(var i=0; i<3; i++) {
var r = portalRadius * (0.3 + i*0.15);
ctx.strokeStyle = 'rgba(94,255,235,' + (0.5 - i*0.15) + ')';
ctx.lineWidth = 1.5;
ctx.beginPath();
ctx.ellipse(px, py, r*0.5, r*0.85, 0, 0, Math.PI*2);
ctx.stroke();
}
ctx.restore();

// 핀 그리기
for(var key in locations) {
var loc = locations[key];
var lx = w * (loc.x / 100);
var ly = h * (loc.y / 100);
var isHovered = hoveredLocation === key;
var pinRadius = isHovered ? w*0.012 : w*0.01;

ctx.save();
ctx.fillStyle = loc.color;
ctx.shadowColor = loc.color;
ctx.shadowBlur = isHovered ? 20 : 12;
ctx.beginPath();
ctx.arc(lx, ly, pinRadius, 0, Math.PI*2);
ctx.fill();

// 외곽 링
if(isHovered) {
ctx.strokeStyle = loc.color;
ctx.lineWidth = 2;
ctx.beginPath();
ctx.arc(lx, ly, pinRadius*1.8, 0, Math.PI*2);
ctx.stroke();
}
ctx.restore();

// 라벨
if(isHovered) {
ctx.fillStyle = loc.color;
ctx.font = Math.floor(w*0.013) + "px 'Share Tech Mono'";
ctx.textAlign = 'center';
ctx.shadowColor = '#000';
ctx.shadowBlur = 5;
ctx.fillText(loc.title, lx, ly + w*0.04);
ctx.shadowBlur = 0;
}
}
}

function animate() {
draw();
requestAnimationFrame(animate);
}
animate();

canvas.addEventListener('mousemove', function(e) {
var rect = canvas.getBoundingClientRect();
var mx = e.clientX - rect.left;
var my = e.clientY - rect.top;
var w = canvas.width;
var h = canvas.height;
var found = null;

for(var key in locations) {
var loc = locations[key];
var lx = w * (loc.x / 100);
var ly = h * (loc.y / 100);
var dx = mx - lx;
var dy = my - ly;
var dist = Math.sqrt(dx*dx + dy*dy);
if(dist < w*0.025) {
found = key;
break;
}
}

if(found !== hoveredLocation) {
hoveredLocation = found;
canvas.style.cursor = found ? 'pointer' : 'default';
}
});

canvas.addEventListener('click', function(e) {
var rect = canvas.getBoundingClientRect();
var mx = e.clientX - rect.left;
var my = e.clientY - rect.top;
var w = canvas.width;
var h = canvas.height;

for(var key in locations) {
var loc = locations[key];
var lx = w * (loc.x / 100);
var ly = h * (loc.y / 100);
var dx = mx - lx;
var dy = my - ly;
var dist = Math.sqrt(dx*dx + dy*dy);
if(dist < w*0.025) {
if(loc.type === 'portal') {
reassembleGlass();
} else {
showPanel(loc);
}
break;
}
}
});

function showPanel(loc) {
document.getElementById('panel-title').textContent = loc.title;
document.getElementById('panel-subtitle').textContent = loc.subtitle;
document.getElementById('panel-content').textContent = loc.content;
document.getElementById('location-panel').classList.add('active');
}

function closePanel() {
document.getElementById('location-panel').classList.remove('active');
}

document.getElementById('panel-close').onclick = closePanel;

function reassembleGlass() {
  var overlay = document.getElementById('glass-overlay');
  var gc = document.getElementById('glass-canvas');
  var gctx = gc.getContext('2d');
  gc.width = window.innerWidth;
  gc.height = window.innerHeight;
  overlay.classList.add('active');
  
  var startTime = Date.now();
  var increaseDuration = 1500;
  
  function animateNoise() {
    var elapsed = Date.now() - startTime;
    var progress = Math.min(elapsed / increaseDuration, 1);
    
    gctx.clearRect(0, 0, gc.width, gc.height);
    
    var noiseIntensity = progress;
    
    var imageData = gctx.createImageData(gc.width, gc.height);
    var data = imageData.data;
    
    for(var i = 0; i < data.length; i += 4) {
      var noise = Math.random() * 255 * noiseIntensity;
      data[i] = noise;
      data[i + 1] = noise;
      data[i + 2] = noise;
      data[i + 3] = 255 * noiseIntensity;
    }
    
    gctx.putImageData(imageData, 0, 0);
    
    if(progress < 1) {
      requestAnimationFrame(animateNoise);
    } else {
      window.location.href = 'worldmap_ko.html';
    }
  }
  
  animateNoise();
}

// 페이지 로드 시 자동으로 노이즈 감소
window.addEventListener('load', function() {
  var overlay = document.getElementById('glass-shatter-overlay');
  var canvas = document.getElementById('glass-canvas');
  
  if(!overlay || !canvas) return;
  
  var ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  overlay.classList.add('active');
  
  var startTime = Date.now();
  var decreaseDuration = 1500;
  
  function fadeInNoise() {
    var elapsed = Date.now() - startTime;
    var progress = Math.min(elapsed / decreaseDuration, 1);
    
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 1 → 0 (노이즈 감소)
    var noiseIntensity = 1 - progress;
    
    var imageData = ctx.createImageData(canvas.width, canvas.height);
    var data = imageData.data;
    
    for(var i = 0; i < data.length; i += 4) {
      var noise = Math.random() * 255 * noiseIntensity;
      data[i] = noise;
      data[i + 1] = noise;
      data[i + 2] = noise;
      data[i + 3] = 255 * noiseIntensity;
    }
    
    ctx.putImageData(imageData, 0, 0);
    
    if(progress < 1) {
      requestAnimationFrame(fadeInNoise);
    } else {
      // 완료되면 오버레이 제거
      overlay.classList.remove('active');
    }
  }
  
  fadeInNoise();
});

</script>
</body>
</html>
